<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>실험 노트</title>
<style>body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#fbfaf7;color:#1d2330;padding:24px 16px}
@media (prefers-color-scheme:dark){body{background:#16191e;color:#e6e9ee}}</style></head>
<body><p id="msg">노트를 불러오는 중…</p>
<script>
// 주소: note.html#<파일 gist id>/<파일 이름(인코딩)>  — # 뒤는 서버로 안 감
(async()=>{
  const [g,...rest]=location.hash.slice(1).split("/");const key=decodeURIComponent(rest.join("/"));
  const raw=k=>"https://gist.githubusercontent.com/jjbangcode/"+g.replace(/[^0-9a-f]/g,"")+"/raw/"+encodeURIComponent(k)+"?t="+Date.now();
  try{
    const r=await fetch(raw(key));if(!r.ok)throw new Error(r.status);
    const doc=new DOMParser().parseFromString(await r.text(),"text/html");
    doc.querySelectorAll("script").forEach(x=>x.remove());
    await Promise.all([...doc.querySelectorAll("img[data-src]")].map(async im=>{try{
      const q=await fetch(raw(im.dataset.src.replace(/\//g,"__")+".b64"));
      if(q.ok)im.src="data:image/png;base64,"+(await q.text()).trim();else im.alt="(그림 올리는 중) "+im.alt}catch(_){}}));
    document.open();document.write("<!doctype html>"+doc.documentElement.outerHTML);document.close();
  }catch(e){document.getElementById("msg").textContent="노트를 못 불러왔어요 ("+(e.message||e)+"). 1~2분 뒤 다시 열어 보세요."}
})();
</script></body></html>
