<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>실험 노트</title>
<style>:root{--bg:#F3F1FA;--ink:#2E3247;--accent:#7C6FD6;--soft:#EEEBFB}
@media (prefers-color-scheme:dark){:root{--bg:#17162B;--ink:#ECEAF7;--accent:#A79BF0;--soft:#2D2A4C}}
body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);padding:24px 16px}
#back{display:inline-block;font-weight:650;padding:8px 16px;border-radius:99px;background:var(--accent);color:#fff;text-decoration:none}</style></head>
<body><p><a id="back" href="./">← 대시보드로</a></p><p id="msg">노트를 불러오는 중…</p>
<script>
// 주소: note.html#<파일 gist id>/<파일 이름(인코딩)>  — # 뒤는 서버로 안 감
(async()=>{
  const P=new URLSearchParams(location.hash.slice(1));const g=P.get("g")||"",key=P.get("f")||"",b=(P.get("b")||"").replace(/[^0-9a-f]/g,"");
  const home="./?v="+Date.now()+"#"+b;document.getElementById("back").href=home;
  const raw=k=>"https://gist.githubusercontent.com/jjbangcode/"+g.replace(/[^0-9a-f]/g,"")+"/raw/"+encodeURIComponent(k)+"?t="+Date.now();
  try{
    // Mac 한글 파일 이름(NFD)과 휴대폰 주소(NFC)가 달라도 찾도록 NFC 로 맞춤
    const get=async k=>{const q=await fetch(raw(k.normalize("NFC")));return q.ok?q:null};   // gist 이름은 NFC 로 통일
    const r=await get(key);if(!r)throw new Error("파일 없음");
    const doc=new DOMParser().parseFromString(await r.text(),"text/html");
    doc.querySelectorAll("script").forEach(x=>x.remove());
    await Promise.all([...doc.querySelectorAll("img[data-src]")].map(async im=>{try{
      const q=await get(im.dataset.src.replace(/\//g,"__")+".b64");
      if(q)im.src="data:image/png;base64,"+(await q.text()).trim();else im.alt="(그림 올리는 중) "+im.alt}catch(_){}}));
    const bar=doc.createElement("div");   // 위에 늘 보이는 '대시보드로' 줄
    bar.innerHTML='<a href="'+home+'" style="display:inline-block;font:650 15px -apple-system,sans-serif;padding:8px 16px;border-radius:99px;background:#7C6FD6;color:#fff;text-decoration:none;box-shadow:0 4px 12px rgba(124,111,214,.28)">← 대시보드로</a>';
    bar.style.cssText="position:sticky;top:0;z-index:9;padding:10px 16px;background:rgba(243,241,250,.94);border-bottom:1px solid #E4DFF5;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)";
    doc.body.insertBefore(bar,doc.body.firstChild);
    document.open();document.write("<!doctype html>"+doc.documentElement.outerHTML);document.close();
  }catch(e){document.getElementById("msg").textContent="노트를 못 불러왔어요 ("+(e.message||e)+"). 1~2분 뒤 다시 열어 보세요."}
})();
</script></body></html>
