<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>작업 현황</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><meta name="robots" content="noindex">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#555d6b;--line:#e3e6eb;--run:#2f6fdb;--ok:#2e8b57;--bad:#c94343;--warn:#c98a1a;--bar:#e9edf3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8ebf0;--mute:#98a0ae;--line:#2c323b;--run:#6c9bf0;--ok:#5cc08a;--bad:#e27474;--warn:#e0b050;--bar:#2a3039;color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
html,body{overflow-x:hidden}
body,.card,.item>div{overflow-wrap:anywhere}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:880px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
h1{font-size:22px;margin:0}
.upd{color:var(--mute);font-size:13px;flex-basis:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font-size:15px;letter-spacing:.02em;color:var(--ink);margin:0 0 10px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mute)}
.dot.busy,.dot.running{background:var(--run);animation:p 1.4s infinite}.dot.done{background:var(--ok)}.dot.failed{background:var(--bad)}
@keyframes p{50%{opacity:.35}}
.big{font-size:17px;font-weight:600}
.mute{color:var(--mute);font-size:14px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bar)}
.bar{height:8px;border-radius:99px;background:var(--bar);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--run)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.v.warn{color:var(--warn)}.v.bad{color:var(--bad)}.v.ok{color:var(--ok)}
.empty{color:var(--mute);font-size:14px}

.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ag{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;background:var(--bg)}
.ag.running{border-color:var(--run);box-shadow:0 0 0 2px color-mix(in srgb,var(--run) 25%,transparent)}
.ag .nm{font-size:17px;font-weight:700}
.ag .role{font-size:13px;color:var(--mute)}
.ag .st{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.ag .what{font-size:13px;color:var(--ink);word-break:break-all}
.hist{margin-top:12px}
.now{display:grid;gap:8px}
.nw{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;border:2px solid var(--run);border-radius:10px;padding:8px 10px;background:var(--bg)}
.nw svg{width:44px;height:44px}
.nw .n{font-size:15px;font-weight:700}.nw .d{font-size:13px;word-break:break-all}.nw .t{font-size:12px;color:var(--mute)}
.faces{display:flex;flex-wrap:wrap;gap:6px}
.card>h2{cursor:pointer;user-select:none;position:relative;padding-right:26px}
.card>h2::after{content:"▾";position:absolute;right:0;top:0;font-size:14px}
.card.fold>h2::after{content:"▸"}
.card.fold>h2{margin-bottom:0}
.card.fold>:not(h2){display:none!important}
.faces .f{display:flex;flex-direction:column;align-items:center;width:52px;font-size:10px;color:var(--mute);opacity:.45}
.faces .f.on{opacity:1;color:var(--ink)}.faces .f.on svg{outline:2px solid var(--run);border-radius:4px}
.faces svg{width:30px;height:30px}
.ag.idle{opacity:.55}
.note{padding:12px 0;border-top:2px dashed rgba(0,0,0,.18)}
.note:first-child{border-top:0}
.note .t{font-size:16px;font-weight:700}
.note .s{font-size:13px;color:var(--mute);margin:2px 0 6px}
.note ul{margin:0;padding-left:20px}
.note li{margin:3px 0;font-size:14px}
code{font-size:12px;color:var(--mute);word-break:break-all}
</style>
<style id="blocktheme">
:root{--sky1:#7ec8f0;--sky2:#bfe6fa;--grass:#5fae3c;--grass2:#4a9330;--dirt:#8a5a35;--dirt2:#74482a;--stone:#c9c9c9;--stone2:#a9a9a9;--panel:#efe9dc;--edgeL:#fffaf0;--edgeD:#6f6a60;--ink:#2a2620;--mute:#5a554c;--run:#2f7de1;--ok:#3c9a3c;--bad:#d04040;--warn:#d89a1c;--bar:#5c574e}
@media (prefers-color-scheme:dark){:root{--sky1:#0e1838;--sky2:#22335e;--panel:#3a3833;--edgeL:#5c5952;--edgeD:#1c1b19;--ink:#f2eee4;--mute:#c8c1b2;--bar:#22211e;color-scheme:dark}}
body{background:linear-gradient(var(--sky1),var(--sky2) 60vh) fixed;font-weight:600;image-rendering:pixelated}
body::before{content:"";display:block;height:28px;margin:-16px -16px 16px;
 background:linear-gradient(var(--grass) 0 9px,var(--grass2) 9px 12px,transparent 12px),
 repeating-linear-gradient(90deg,var(--dirt) 0 14px,var(--dirt2) 14px 16px);}
h1,.card h2,.ag .nm,.stat .v,.px{font-family:"Press Start 2P","Apple SD Gothic Neo",monospace}
h1{font-size:16px;line-height:1.6;color:#fff;text-shadow:2px 2px 0 #2a2620;word-spacing:-.6em}
.card h2,.ag .nm{word-spacing:-.6em}
.upd{color:#13202e;font-weight:700}
@media (prefers-color-scheme:dark){.upd{color:#dfe8ff}}
.card{background:var(--panel);border:0;border-radius:0;
 box-shadow:inset 4px 4px 0 var(--edgeL),inset -4px -4px 0 var(--edgeD),0 0 0 3px #2a2620;padding:16px 18px}
.card h2{font-size:11px;line-height:1.7;color:var(--ink);text-transform:none;margin-bottom:12px}
.card h2::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:-1px;background:var(--grass);box-shadow:inset -2px -2px 0 var(--grass2)}
.dot{border-radius:0;width:12px;height:12px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.dot.busy,.dot.running{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.ag{border:0;border-radius:0;background:var(--stone);box-shadow:inset 3px 3px 0 #e8e8e8,inset -3px -3px 0 #7d7d7d,0 0 0 2px #2a2620;grid-template-columns:auto 1fr;column-gap:10px;color:#22201c}
@media (prefers-color-scheme:dark){.ag{background:#5e5e5e;box-shadow:inset 3px 3px 0 #7c7c7c,inset -3px -3px 0 #3b3b3b,0 0 0 2px #111;color:#f4f4f4}}
.ag>svg{grid-row:1/span 4;width:40px;height:40px}
.ag.running{box-shadow:inset 3px 3px 0 #e8e8e8,inset -3px -3px 0 #7d7d7d,0 0 0 3px var(--run)}
.ag.running>svg{animation:hop .6s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-4px)}}
.ag .nm{font-size:11px;line-height:1.6}
.ag .role,.ag .what{color:inherit;opacity:.8}
.ag .st{font-size:14px}
.tag{border-radius:0;background:var(--stone2);color:#22201c}
.bar{border-radius:0;height:14px;background:var(--bar);box-shadow:0 0 0 2px #2a2620}
.bar i{background:repeating-linear-gradient(90deg,var(--grass) 0 12px,var(--grass2) 12px 14px)}
.stat{background:rgba(0,0,0,.06);padding:10px;box-shadow:inset 2px 2px 0 rgba(0,0,0,.15)}
.stat .v{font-size:14px;line-height:1.8}
.stat .v .mute{font-family:inherit;font-size:9px}
#rf{font-family:"Press Start 2P",monospace!important;font-size:10px!important;border-radius:0!important;border:0!important;background:var(--stone)!important;color:#22201c!important;box-shadow:inset 2px 2px 0 #eee,inset -2px -2px 0 #777,0 0 0 2px #2a2620;padding:8px 10px!important;cursor:pointer}
.item{border-top:2px dashed rgba(0,0,0,.18)}
.nlink{display:block;color:inherit;text-decoration:underline;text-underline-offset:3px}
a.fbtn{text-decoration:none;display:inline-block}
.mq{flex:1;overflow:hidden;white-space:nowrap;min-width:0}
.mq>span{display:inline-block;padding-right:4px}
.mq.go>span{animation:mq var(--t,6s) linear infinite}
@keyframes mq{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(var(--d))}}
.todo{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:9px 0;border-top:2px dashed rgba(0,0,0,.18)}
.todo:first-child{border-top:0}
.todo .ic{font-size:20px;line-height:1.2}
.todo .w{font-size:12px;font-weight:700;opacity:.75}
.todo .d{font-size:15px;font-weight:600}
.todo.done .d{opacity:.8}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fbtn{font:inherit;font-size:13px;padding:4px 8px;border:2px solid #22201c;background:var(--bar);color:var(--ink);border-radius:0;cursor:pointer;max-width:100%;text-align:left}
.fbtn.off{opacity:.45;cursor:default;border-style:dashed}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;padding:max(12px,env(safe-area-inset-top)) 10px 12px}
#viewer.on{display:flex;flex-direction:column}
#viewer .bar{display:flex;gap:8px;align-items:center;background:var(--card);padding:8px 10px;border:2px solid #22201c}
#viewer .bar b{flex:1;font-size:13px;overflow-wrap:anywhere}
#viewer .bar button{font:inherit;font-size:14px;padding:6px 12px;border:2px solid #22201c;background:var(--bar);color:var(--ink);cursor:pointer}
#viewer .body{flex:1;overflow:auto;background:var(--card);border:2px solid #22201c;border-top:0;padding:10px}
#viewer pre{margin:0;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;word-break:break-word}
#viewer img{max-width:100%;height:auto;display:block;background:#fff}
#viewer table{border-collapse:collapse;font-size:12px}
#viewer td,#viewer th{border:1px solid var(--line);padding:3px 6px;white-space:nowrap}
</style></head>
<body>
<main>
  <header><h1>연구 작업 현황</h1><span class="upd" id="upd">불러오는 중…</span><button id="rf" style="font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px">새로고침</button></header>

  <section class="card"><h2>지금 일하는 에이전트</h2><div id="faces" class="faces"></div></section>

  <section class="card"><h2>맡긴 일 체크리스트</h2><div class="mute" style="font-size:13px;margin:-4px 0 8px">⏳ 하는 중 · ✅ 5분 안에 끝남 · ❌ 실패</div><div id="todo" class="list"></div></section>
  <section class="card"><h2>논문 그림 (최종본)</h2><div class="mute" style="font-size:13px;margin:-4px 0 8px">"그림 보기" 를 누르면 그림이 열려요</div><div id="pfigs" class="list"></div></section>
  <section class="card"><h2>토론 결과</h2><div class="mute" style="font-size:13px;margin:-4px 0 8px">제목을 누르면 결론·할 일·자세한 내용이 열려요</div><div id="debates" class="list"></div></section>
  <section class="card"><h2>오케스트레이터</h2><div id="orch" class="empty">기록 없음</div></section>

  <section class="card"><h2>에이전트 12명</h2><div id="team" class="team"></div><div id="agents" style="display:none"></div></section>

  <section class="card"><h2>돌고 있는 계산</h2><div id="jobs" class="list"></div></section>

  <section class="card"><h2>컴퓨터 상태</h2><div id="guard" class="item" style="border:0;padding:0 0 10px"></div><div id="sys" class="grid"></div></section>


  <section class="card"><h2>실험 노트 · 결과 정리</h2><div id="notes" class="list"></div></section>
</main>
<div id="viewer"><div class="bar"><b id="vname"></b><button id="vclose">닫기</button></div><div class="body" id="vbody"></div></div>
<script>
const NAME={"code-writer":"코드 작성","code-checker":"코드 점검","compute-manager":"계산 조절","research-advisor":"문헌 검증","paper-writer":"논문 초안","results-analyst":"결과 분석","html-publisher":"노트 HTML","figure-maker":"그래프","note-writer":"실험노트","codex-reviewer":"Codex 검토","session-recorder":"기록","debate-moderator":"토론","general":"일반","general-purpose":"일반","Explore":"탐색","fork":"분기","orchestrator":"오케스트레이터"};
let UP=new Set(),FG="";
const ICON=f=>f.endsWith(".png")?"🖼":f.endsWith(".md")||f.endsWith(".html")?"📝":f.endsWith(".csv")?"📊":f.endsWith(".py")?"💻":"📄";
function noteHref(f){return "note.html?v="+VER+"#"+new URLSearchParams({g:FG,f:f.replace(/\//g,"__"),b:GIST})}
function noteLink(f,label){if(!f)return esc(label);return UP.has(f)?`<a class="nlink" href="${noteHref(f)}">${esc(label)} <span style="font-size:12px">↗ 열기</span></a>`:`${esc(label)} <span class="mute" style="font-size:12px">(올리는 중)</span>`}
function filesHTML(fs){if(!fs||!fs.length)return "";return `<div class="files">${fs.map(f=>{const on=UP.has(f);const nm=f.split("/").pop();
  if(on&&f.endsWith(".html"))return `<a class="fbtn" href="${noteHref(f)}">${ICON(f)} ${esc(nm)} ↗</a>`;
  return `<button class="fbtn${on?"":" off"}" data-f="${esc(f)}" title="${esc(f)}">${ICON(f)} ${esc(nm)}${on?"":" (올리는 중)"}</button>`}).join("")}</div>`}
function csvTable(t){const rows=t.trim().split(/\r?\n/).slice(0,300).map(l=>l.split(","));
  return `<div style="overflow:auto"><table>${rows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join("")}</tr>`).join("")}</table></div>`}
async function openFile(f){const v=document.getElementById("viewer"),b=document.getElementById("vbody");
  document.getElementById("vname").textContent=f;b.style.padding="";b.innerHTML='<div class="mute">불러오는 중…</div>';v.classList.add("on");
  const key=(f.replace(/\//g,"__")+(f.endsWith(".png")?".b64":"")).normalize("NFC");
  try{const r=await fetch("https://gist.githubusercontent.com/jjbangcode/"+FG+"/raw/"+encodeURIComponent(key)+"?t="+Date.now());
    if(!r.ok)throw new Error(r.status);const t=await r.text();
    if(f.endsWith(".png")){const i=new Image();i.onload=()=>{if(i.naturalWidth>2400){i.style.maxWidth="none";i.style.width="1100px"}};i.src="data:image/png;base64,"+t.trim();i.alt=f;b.innerHTML='<div class="mute" style="font-size:12px;margin-bottom:6px">큰 그림은 옆으로 밀어서 보세요 ↔</div>';b.appendChild(i)}
    else if(f.endsWith(".html")){const doc=new DOMParser().parseFromString(t,"text/html");
      await Promise.all([...doc.querySelectorAll("img[data-src]")].map(async im=>{try{
        const k=(im.dataset.src.replace(/\//g,"__")+".b64").normalize("NFC");
        const q=await fetch("https://gist.githubusercontent.com/jjbangcode/"+FG+"/raw/"+encodeURIComponent(k)+"?t="+Date.now());
        if(q.ok)im.src="data:image/png;base64,"+(await q.text()).trim();else im.alt="(그림 올리는 중) "+im.alt}catch(_){}}));
      doc.querySelectorAll("script").forEach(x=>x.remove());
      const fr=document.createElement("iframe");fr.setAttribute("sandbox","");fr.style.cssText="border:0;width:100%;height:100%;display:block;background:#fff";
      fr.srcdoc="<!doctype html>"+doc.documentElement.outerHTML;b.innerHTML="";b.style.padding="0";b.appendChild(fr)}
    else if(f.endsWith(".csv"))b.innerHTML=csvTable(t);
    else{const pr=document.createElement("pre");pr.textContent=t;b.innerHTML="";b.appendChild(pr)}
  }catch(e){b.innerHTML='<div class="mute">파일을 못 불러왔어요 ('+esc(String(e.message||e))+'). 1~2분 뒤 다시 눌러 보세요.</div>'}}
document.addEventListener("click",e=>{const nt=e.target.closest(".nopen");if(nt&&nt.dataset.f&&UP.has(nt.dataset.f))openFile(nt.dataset.f);const x=e.target.closest(".fbtn");if(x&&!x.classList.contains("off"))openFile(x.dataset.f);
  if(e.target.id==="vclose"||e.target.id==="viewer")document.getElementById("viewer").classList.remove("on")});
const SPR={
"code-writer":["..HHHH..",".HHHHHH.",".SSSSSS.",".SESSES.",".SSSSSS.","..SMMS..","..BBBB..",".BBBBBB."],
"code-checker":["..HHHH..",".HHHHHH.",".SSSSSS.",".GEGGEG.",".SSSSSS.","..SMMS..","..BBBB..",".BBBBBB."],
"compute-manager":["H......H",".HHHHHH.",".SSSSSS.",".SESSES.",".SSSSSS.","..SSSS..","BBBBBBBB","BBBBBBBB"],
"research-advisor":["...HH...","..HHHH..",".SSSSSS.",".GEGGEG.",".SSSSSS.","..SMMS..",".BBBBBB.","BBBBBBBB"],
"results-analyst":["........","..HHHH..",".HSSSSH.",".GEGGEG.",".SSSSSS.","..SMMS..","..BBBB.R",".BBBBBRR"],
"paper-writer":[".HHHHHH.","HHHHHHHH",".SSSSSS.",".SESSES.",".SSSSSS.","..SMMS..","..BBBB.T",".BBBBBBT"],
"figure-maker":["..HHH...",".HHHHH..",".SSSSSS.",".SESSES.",".SSSSSS.","..SMMS.R","..BBBBRR",".BBBBBR."],
"note-writer":["..HHHH..",".H....H.",".SSSSSS.",".GEGGEG.",".SSSSSS.","..SMMS..",".TBBBB..","TTBBBBBB"],
"codex-reviewer":["HHHHHHHH","H.HHHH.H",".SSSSSS.",".GEGGEG.",".SSSSSS.","..SMMS..",".BBBBBB.","BBBBBBBB"],
"session-recorder":["..HHHH..",".HHHHHH.",".SSSSSS.",".SESSES.",".SSSSSS.","..SMMS..","TTBBBB..","TTBBBBBB"],
"debate-moderator":["H.HHHH.H",".HHHHHH.",".SSSSSS.",".SESSES.",".SSSSSS.","..SMMS..",".BBBBBB.","BBBBBBBB"],
"html-publisher":["HHHHHHHH","..HHHH..",".SSSSSS.",".SESSES.",".SSSSSS.","..SMMS..","..BBBB..","BBBBBBBB"]};
const PAL={"code-writer":"#3b7dd8","code-checker":"#d8a03b","compute-manager":"#d04a3b","research-advisor":"#7a4fc4","paper-writer":"#2f9e6e","results-analyst":"#e07a1f","html-publisher":"#1f9fb0","figure-maker":"#c43b8a","note-writer":"#6b8e23","codex-reviewer":"#111111","session-recorder":"#8a6d3b","debate-moderator":"#2e7d6b"};
function sprite(id){const p=SPR[id]||SPR["code-writer"],c={H:PAL[id]||"#888",S:"#f0c8a0",E:"#222",G:"#555",M:"#b0604a",B:PAL[id]||"#888",T:"#e8e0c8",R:"#3c9a3c"};
 let r="";p.forEach((row,y)=>[...row].forEach((ch,x)=>{if(c[ch])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c[ch]}"/>`}));
 return `<svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const TEAM=[["code-writer","코드 작성","새 코드·수정"],["code-checker","코드 점검","누수·계산 오류 찾기"],["compute-manager","계산 조절","컴퓨터 부하·실행"],["results-analyst","결과 분석","짝 비교·신뢰구간"],["figure-maker","그래프","결과 그림"],["note-writer","실험노트","노트 작성"],["research-advisor","문헌 검증","논문 비교·더 좋은 방법"],["paper-writer","논문 초안","원고 쓰기"],["codex-reviewer","Codex 검토","최종 관문·교차 검토"],["session-recorder","기록","인수인계·다른 창 이어 하기"],["debate-moderator","토론","전문가 8명 토론 진행"],["html-publisher","노트 HTML","노트를 보기 좋게"]];
function nowHTML(ag,now){
  const run=TEAM.map(([id,nm])=>[id,nm,ag.find(a=>(a.role===id||a.agent===id)&&a.state==="running")]).filter(x=>x[2]);
  return run.map(([id,nm,r])=>`<div class="nw">${sprite(id)}<div><div class="n">⏳ ${nm} <span class="t">· ${dur(now-r.start)}째</span></div><div class="d">${esc(r.desc||"")}</div></div></div>`).join("")||`<div class="empty">지금 일하는 에이전트 없음</div>`}
function facesHTML(ag){const G=(window.__d&&window.__d.guard)||{state:"off"};
  return TEAM.map(([id,nm])=>{const on=id==="compute-manager"?G.state!=="off":ag.some(a=>(a.role===id||a.agent===id)&&a.state==="running");
    return `<div class="f ${on?"on":""}">${sprite(id)}<span>${nm}</span></div>`}).join("")}
function team(ag,now){
  const G=(window.__d&&window.__d.guard)||{state:"off"};
  const isRun=id=>ag.some(a=>(a.role===id||a.agent===id)&&a.state==="running");
  return [...TEAM].sort((x,y)=>isRun(y[0])-isRun(x[0])).map(([id,nm,role])=>{const r=ag.find(a=>a.role===id||a.agent===id);
    if(id==="compute-manager"){const on=G.state!=="off";const t=on?(G.state==="ok"?"실시간 감시 중 · 안전":G.state==="paused"?"학습 일시정지함":"실시간 감시 중 · 주의"):"감시 꺼짐";
      return `<div class="ag ${on?"running":"idle"}">${sprite(id)}<div class="nm">${nm}</div><div class="role">${role}</div><div class="st"><span class="dot ${on?"running":""}"></span><span class="mq"><span>${t}</span></span></div><div class="what">20초마다 부하·메모리·발열 확인${G.load!=null?" · 부하 "+G.load+" · 메모리 여유 "+G.mem_free+"%":""}</div></div>`}
    const st=!r?"idle":r.state;
    const lab=!r?"대기 (아직 일 안 함)":st==="running"?"일하는 중 · "+dur(now-r.start)+"째":st==="done"?"대기 · "+ago(r.end,now)+" 끝남":st==="failed"?"실패 · "+ago(r.end,now):"확인 안 됨";
    return `<div class="ag ${st}">${sprite(id)}<div class="nm">${nm}</div><div class="role">${role}</div><div class="st"><span class="dot ${st==="idle"?"":st==="done"?"":st}"></span><span class="mq"><span>${lab}</span></span></div>${r&&st==="running"?`<div class="what">${esc(r.desc)}</div>`:""}</div>`}).join("");
}
const ST={running:"진행 중",done:"끝남",failed:"실패",unknown:"확인 안 됨"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=(t,now)=>{const s=Math.max(0,Math.round(now-t));return s<60?s+"초 전":s<3600?Math.round(s/60)+"분 전":Math.round(s/3600)+"시간 전"};
const dur=s=>{s=Math.round(s);return s<60?s+"초":s<3600?Math.floor(s/60)+"분 "+(s%60)+"초":Math.floor(s/3600)+"시간 "+Math.round(s%3600/60)+"분"};
function notesHTML(ns){return (ns||[]).map(n=>`<div class="note" style="padding:8px 0"><div class="t">${noteLink((n.files||[])[0],"📝 "+n.title)}</div><div class="mute" style="font-size:12px">${esc(n.date)}</div></div>`).join("")||`<div class="empty">노트 없음</div>`}

function todoHTML(d,now){
  const items=[];
  for(const a of d.agents||[]){if(a.role==="orchestrator"||a.agent==="orchestrator")continue;
    items.push({who:NAME[a.role]||NAME[a.agent]||a.role||a.agent||"에이전트",desc:a.desc,start:a.start,end:a.end,state:a.state})}
  for(const j of d.job_history||[])items.push({who:"컴퓨터 계산",desc:j.desc,start:j.start,end:j.end,state:j.state});
  items.sort((x,y)=>(x.state==="running")-(y.state==="running")||0);
  const run=items.filter(i=>i.state==="running").sort((a,b)=>b.start-a.start);
  const rest=items.filter(i=>i.state!=="running"&&now-(i.end||i.start)<=300).sort((a,b)=>(b.end||b.start)-(a.end||a.start));   // 끝난 일은 5분 안 것만
  const IC={running:"⏳",done:"✅",failed:"❌",unknown:"❔"};
  const L=[...run,...rest].map(i=>{const st=i.state==="running"?`하는 중 · ${dur(now-i.start)}째`:i.state==="done"?`끝남 · ${ago(i.end||i.start,now)}${i.end?` (${dur(i.end-i.start)} 걸림)`:""}`:i.state==="failed"?`실패 · ${ago(i.end||i.start,now)}`:"확인 안 됨";
    return `<div class="todo ${i.state}"><div class="ic">${IC[i.state]||"•"}</div><div><div class="w">${esc(i.who)}</div><div class="d">${esc(i.desc||"(설명 없음)")}</div><div class="mute" style="font-size:13px">${st}</div></div></div>`});
  return L.join("")||`<div class="empty">지금 하는 일 없음 (최근 5분 안에 끝난 일도 없음)</div>`}

function pfigsHTML(ps,now){return (ps||[]).map(p=>{const on=UP.has(p.file);
  return `<div class="note" style="padding:8px 0"><div class="t">🖼 ${esc(p.name)} <button class="fbtn${on?"":" off"}" data-f="${esc(p.file)}">${on?"그림 보기":"올리는 중"}</button></div><div class="mute" style="font-size:12px">${ago(p.mtime,now)}</div></div>`}).join("")||`<div class="empty">최종 그림 없음</div>`}

function debatesHTML(ds,now){return (ds||[]).map(d=>`<div class="note" style="padding:8px 0"><div class="t">${d.file?noteLink(d.file,"💬 "+d.topic.replace(/^\d{4}-\d\d-\d\d_/,"").replace(/_/g," ")):esc("💬 "+d.topic)}</div><div class="mute" style="font-size:12px">${ago(d.mtime,now)}</div></div>`).join("")||`<div class="empty">아직 토론 없음</div>`}
function render(d){window.__d=d;UP=new Set(d.uploaded||[]);FG=d.files_gist||"";
  const now=d.now, o=d.orchestrator;
  document.getElementById("upd").textContent="업데이트 "+new Date(now*1000).toLocaleTimeString("ko-KR");
  const busy=o.state==="busy";
  document.getElementById("orch").innerHTML=o.since?`<div class="row"><span class="dot ${busy?"busy":"done"}"></span><span class="big">${busy?"일하는 중":"대기 중"}</span><span class="mute">${ago(o.since,now)}부터</span></div>`:`<span class="empty">아직 기록 없음 (새 세션부터 기록돼요)</span>`;
  const ag=d.agents;
  document.getElementById("team").innerHTML=team(ag,now);
  document.getElementById("faces").innerHTML=facesHTML(ag);
  document.getElementById("todo").innerHTML=todoHTML(d,now);
  document.getElementById("pfigs").innerHTML=pfigsHTML(d.paper_figs,now);
  document.getElementById("debates").innerHTML=debatesHTML(d.debates,now);
  requestAnimationFrame(()=>document.querySelectorAll(".mq").forEach(m=>{const o=m.firstElementChild.scrollWidth-m.clientWidth;
    m.classList.toggle("go",o>2);if(o>2){m.style.setProperty("--d",-o+"px");m.style.setProperty("--t",Math.max(4,o/12+3)+"s")}}));
  document.getElementById("agents").innerHTML=ag.length?ag.slice(0,3).map(a=>`<div class="item"><span class="dot ${a.state}"></span><div><div><span class="tag">${esc(NAME[a.agent]||a.agent)}</span> ${esc(a.desc)}</div><div class="mute">${ST[a.state]||a.state} · ${a.end?dur(a.end-a.start)+" 걸림":dur(now-a.start)+"째"} · ${ago(a.start,now)} 시작</div>${filesHTML(a.files)}</div></div>`).join(""):`<div class="empty">아직 맡긴 일 없음</div>`;
  const js=d.jobs;
  document.getElementById("jobs").innerHTML=js.length?js.map(j=>{const p=j.progress;const pct=p&&p.total?Math.min(100,100*p.done/p.total):null;return `<div class="item"><span class="dot running"></span><div><div class="big" style="font-size:15px">${esc(j.desc||j.script)}</div><div class="mute" style="font-size:12px">${esc(j.script)}</div>${pct!==null?`<div class="bar"><i style="width:${pct}%"></i></div><div class="mute">${p.done}/${p.total} 실행 · ${esc(p.last)}</div>`:""}<div class="mute">실행 ${esc(j.elapsed)} · worker ${d.shards} 개 · CPU ${d.shard_cpu}%</div></div></div>`}).join(""):`<div class="empty">돌고 있는 학습·분석 없음</div>`;
  const s=d.system||{};const ld=s.load?s.load[0]:null;
  const lcls=ld==null?"":ld>s.ncpu*0.75?"bad":ld>7?"warn":"ok";
  const mcls=s.mem_free_pct<15?"bad":s.mem_free_pct<25?"warn":"ok";
  const dcls=s.disk_free_gb<20?"bad":s.disk_free_gb<40?"warn":"ok";
  const tcls=s.cpu_speed_limit<70?"bad":s.cpu_speed_limit<100?"warn":"ok";
  {const g=d.guard||{state:"off"};const GS={ok:["ok","감시 중 · 안전"],warn:["warn","감시 중 · 주의: "+(g.warn||[]).join(", ")],danger:["failed","위험 — 1분 계속되면 학습 일시정지"],paused:["failed","학습 "+g.paused+"개 일시정지함 (컴퓨터 보호)"],off:["unknown","감시 꺼짐 (Mac 확인 필요)"]}[g.state]||["unknown",g.state];
   const ev=(g.events||[]).slice(-1)[0];
   document.getElementById("guard").innerHTML=`<span class="dot ${GS[0]==="ok"?"done":GS[0]}"></span><div><div><span class="tag">계산 조절 · 실시간</span> ${esc(GS[1])}</div><div class="mute">20초마다 확인${g.jobs!=null?" · 학습 프로세스 "+g.jobs+"개":""}${ev?" · 최근: "+esc(ev[1]):""}</div></div>`;}
  document.getElementById("sys").innerHTML=`
   <div class="stat"><div class="mute">CPU 부하 (1분)</div><div class="v ${lcls}">${ld??"–"} <span class="mute">/ ${s.ncpu??"–"}코어</span></div></div>
   <div class="stat"><div class="mute">메모리 여유</div><div class="v ${mcls}">${s.mem_free_pct??"–"}%</div></div>
   <div class="stat"><div class="mute">디스크 여유</div><div class="v ${dcls}">${s.disk_free_gb??"–"} GB</div></div>
   <div class="stat"><div class="mute">발열</div><div class="v ${tcls}">${s.cpu_speed_limit==null?"–":s.cpu_speed_limit>=100?"정상":"뜨거움"}</div><div class="mute" style="font-size:12px">${s.cpu_speed_limit==null?"":s.cpu_speed_limit>=100?"열 때문에 느려지지 않음":"열 때문에 속도 "+s.cpu_speed_limit+"%로 제한"}</div></div>`;
  document.getElementById("notes").innerHTML=notesHTML(d.notes);
}
const GIST=location.hash.slice(1).replace(/[^0-9a-f]/g,"");
async function load(){
  try{const r=await fetch("https://api.github.com/gists/"+GIST,{cache:"no-store"});
      if(r.ok){const g=await r.json();return JSON.parse(g.files["status.json"].content)}}catch(e){}
  const r=await fetch("https://gist.githubusercontent.com/jjbangcode/"+GIST+"/raw/status.json?t="+Date.now());
  return r.json();
}
async function tick(){
  if(!GIST){document.getElementById("upd").textContent="주소 끝에 #(데이터 번호)가 필요해요";return}
  try{const d=await load();render(d);
      const late=Date.now()/1000-d.now;
      if(late>300)document.getElementById("upd").textContent="⚠ Mac 에서 "+Math.round(late/60)+"분째 소식 없음 (Mac 꺼짐·잠자기·전송 멈춤)";
      else document.getElementById("upd").textContent="Mac 기준 "+new Date(d.now*1000).toLocaleTimeString("ko-KR")+" ("+Math.round(late)+"초 전)";}
  catch(e){document.getElementById("upd").textContent="불러오기 실패 — 잠시 뒤 다시 시도해요"}
}
const VER="41";   // 화면 버전: 바뀌면 휴대폰에 남아 있는 옛 화면을 스스로 새로 받음
async function verCheck(){try{const t=await (await fetch(location.pathname+"?nc="+Date.now(),{cache:"no-store"})).text();
  const m=t.match(/const VER="(\d+)"/);if(m&&m[1]!==VER)location.replace(location.pathname+"?v="+m[1]+location.hash)}catch(_){}}
tick();verCheck();setInterval(()=>{tick();verCheck()},90000);
document.getElementById("rf").onclick=e=>{e.currentTarget.textContent="불러오는 중…";   // 화면 자체를 새로 받음 (옛 화면이 남지 않게)
  location.replace(location.pathname+"?v="+Date.now()+location.hash)};
</script>
<script>
(function(){const K="fold_v1";let F={};try{F=JSON.parse(localStorage.getItem(K)||"{}")}catch(_){}
 document.querySelectorAll("section.card").forEach(c=>{const h=c.querySelector(":scope>h2");if(!h)return;const k=h.textContent.trim();
  if(F[k])c.classList.add("fold");
  h.addEventListener("click",()=>{c.classList.toggle("fold");F[k]=c.classList.contains("fold");try{localStorage.setItem(K,JSON.stringify(F))}catch(_){}})})})();
</script>
