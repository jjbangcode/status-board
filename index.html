<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>작업 현황</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
/* 2026-11-24 차분한 디자인: 흰 바탕·먹색·가는 글자 (CALM) */
:root{--brown:#A88B6E;--brown2:#8A5A34;--bg:#FFFFFF;--cardline:#E4E2DE;--gdot:#D9D6D0;--card:#fff;--ink:#2B2B2B;--mute:#77746E;--line:#E4E2DE;--accent:#2B2B2B;--accent2:#6A6A6A;--soft:#F5F3EF;--run:#2B2B2B;--ok:#3FA37A;--bad:#E0607A;--warn:#D9952B;--bar:#ECE9E4;--onacc:#fff;--hdr:#FAF8F5;--shadow:0 1px 2px rgba(0,0,0,.03),0 4px 14px rgba(0,0,0,.04);--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--brown:#9C8266;--brown2:#D2A273;--bg:#171715;--cardline:#34332F;--gdot:rgba(255,255,255,.12);--card:#201F1C;--ink:#ECE9E2;--mute:#A09C93;--line:#34332F;--accent:#ECE9E2;--accent2:#A09C93;--soft:#2A2926;--run:#ECE9E2;--ok:#5CC08A;--bad:#F07C93;--warn:#E8B45A;--bar:#2F2E2A;--onacc:#1B1B1A;--hdr:#201F1C;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
html,body{overflow-x:hidden}
html{scroll-behavior:smooth}
body,.card,.item>div{overflow-wrap:anywhere}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Jost","Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{max-width:900px;margin:0 auto;display:grid;gap:16px}
a{color:var(--accent)}
/* 머리 */
header{border:1px solid var(--cardline);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:var(--hdr);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;isolation:isolate}
header::before{content:"";position:absolute;z-index:-1;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:none;pointer-events:none}
.mascot{grid-row:1/span 2;width:72px;height:72px;position:relative}
.mascot .li{width:60px;height:60px;margin:6px;color:var(--brown2)}
h1{font-size:19px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:300}
.upd{color:var(--mute);font-size:13px}
.hbtns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hbtn{font:inherit;font-size:13px;font-weight:400;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--onacc);border-radius:99px;padding:7px 14px;text-decoration:none;cursor:pointer}
.hbtn.pri{background:var(--accent);color:var(--onacc)}
.hbtn svg{width:16px;height:16px}
@media (min-width:560px){header{grid-template-columns:auto 1fr auto}.hbtns{grid-column:3;grid-row:1/span 2;margin:0}}
/* 카드 */
.card{background:var(--card);border:1px solid var(--cardline);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.card h2{font-size:15px;color:var(--ink);margin:0 0 12px;font-weight:300;letter-spacing:.12em;text-transform:uppercase}
.card>h2{cursor:pointer;user-select:none;-webkit-user-select:none;position:relative;padding-right:28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>h2::after{content:"";position:absolute;right:6px;top:50%;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-75%) rotate(45deg);transition:transform .2s}
.card.fold>h2::after{transform:translateY(-50%) rotate(-45deg)}
.card.fold>h2{margin-bottom:0}
.card.fold>:not(h2){display:none!important}
.hi{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--soft);flex:none}
.hi .li{width:24px;height:24px}
.sub{color:var(--mute);font-size:13px;margin:-4px 0 10px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sub svg{width:16px;height:16px;vertical-align:-3px}
#ibc:not(:empty){font-size:12px;font-weight:700;background:var(--accent);color:var(--onacc);border-radius:99px;padding:2px 9px}
/* 공통 */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mute)}
.dot.busy,.dot.running{background:var(--run);animation:ping 1.8s ease-out infinite}
.dot.done{background:var(--ok)}.dot.failed{background:var(--bad)}
.big{font-size:17px;font-weight:650}
.mute{color:var(--mute);font-size:14px}
.list{display:grid;gap:4px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tag{font-size:12px;font-weight:650;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--bar);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.empty{color:var(--mute);font-size:14px;padding:4px 0}
code{font-size:12px;color:var(--mute);word-break:break-all}
/* 숫자 요약 */
.stat{display:flex;flex-direction:column;gap:2px;background:var(--soft);border-radius:16px;padding:14px 14px 12px}
.stat .v{order:-1;font-size:30px;line-height:1.15;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.stat .v .mute{font-size:13px;font-weight:600;letter-spacing:0}
.stat>.mute{font-size:13px}
.v.warn{color:var(--warn)}.v.bad{color:var(--bad)}.v.ok{color:var(--ok)}
/* 지금 일하는 에이전트 */
.faces{display:flex;flex-wrap:wrap;gap:6px 4px}
.faces .f{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;width:60px;font-size:10.5px;line-height:1.25;text-align:center;color:var(--mute);opacity:.85;transition:opacity .2s}
.faces .f .li{width:40px;height:40px;margin:2px 0 3px}
.faces .f:not(.on) .li{opacity:.7}
.faces .f.on{opacity:1;color:var(--ink);font-weight:650}
.faces .f.on::before{content:"";position:absolute;z-index:-1;top:16px;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:var(--soft);box-shadow:0 0 0 0 rgba(43,43,43,.25);animation:pulse 2s ease-out infinite}
.faces .tt{font-size:11px;font-weight:750;color:var(--onacc);background:var(--accent);border-radius:99px;padding:0 6px;min-height:16px;line-height:16px;white-space:nowrap}
.faces .tt:empty,.faces .tt.no{background:none}
/* 에이전트 연결 그래프 (2026-11-24) */
#s-faces h2{display:flex;align-items:center;gap:6px}
.vbtn{margin-left:auto;font:inherit;font-size:12.5px;font-weight:400;border:0;background:var(--accent);color:var(--onacc);border-radius:99px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.agraph{border-radius:14px;background-color:var(--soft);padding:6px;overflow:hidden}
.faces[hidden],.agraph[hidden]{display:none!important}
.agraph svg.ag-g{display:block;width:100%;height:auto}
.ag-g .eg{fill:none;stroke:var(--brown);stroke-width:1.6;opacity:.45}
.ag-g .eg.bk{stroke-dasharray:4 4}
.ag-g .eg.flow{stroke:var(--brown2);stroke-width:2.4;opacity:1;stroke-dasharray:7 6;animation:agflow .9s linear infinite}
.ag-g .ah{fill:var(--brown);opacity:.6}.ag-g .ah.on{fill:var(--brown2);opacity:1}
.ag-g .nd{opacity:.6}
.ag-g .nd .bx{fill:transparent;stroke:none}
.ag-g .nd text{fill:var(--mute);font-size:13px;font-weight:600}
.ag-g.nar .nd text{font-size:14.5px}
.ag-g .nd.on{opacity:1}
.ag-g .nd.on .bx{stroke:none}
.ag-g .nd .tm{fill:var(--mute);font-size:11px;font-weight:500}
.ag-g .nd.on text{fill:var(--ink);font-weight:750}
.ag-g .nd .hl{display:none}
.ag-g .nd.on .hl{transform-box:fill-box;transform-origin:center;animation:agpulse 1.8s ease-out infinite}
.ag-g .nd.usr .bx{fill:transparent;stroke:none}.ag-g .nd.usr text{fill:var(--ink)}.ag-g .nd.usr{opacity:.85}
.ag-g .tg{fill:var(--accent)}.ag-g .tgt{fill:#fff;font-size:10.5px;font-weight:750}
.ag-g .sec{fill:var(--mute);font-size:12px;font-weight:700}
.ag-g .sbx{fill:none;stroke:var(--brown);stroke-dasharray:3 5;opacity:.6}
@keyframes agflow{to{stroke-dashoffset:-13}}
@keyframes agpulse{0%{opacity:.10;transform:scale(1)}100%{opacity:0;transform:scale(1.08,1.35)}}
@media (prefers-reduced-motion:reduce){.ag-g .eg.flow,.ag-g .nd.on .hl{animation:none!important}.ag-g .nd.on .hl{opacity:.5}}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ag{border-radius:16px;padding:12px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;gap:4px;background:var(--soft)}
.ag>svg{grid-row:1/span 4;width:40px;height:40px}
.ag.running{box-shadow:0 0 0 2px var(--accent)}
.ag.idle{opacity:.7}
.ag .nm{font-size:15px;font-weight:700}
.ag .role{font-size:13px;color:var(--mute)}
.ag .st{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.ag .what{font-size:13px;word-break:break-all}
.now{display:grid;gap:8px}
.nw{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;border-radius:14px;padding:8px 10px;background:var(--soft);animation:pulse 2s ease-out infinite}
.nw svg{width:44px;height:44px}
.nw .n{font-size:15px;font-weight:700;display:flex;align-items:center;gap:4px}.nw .n svg{width:18px;height:18px}.nw .d{font-size:13px;word-break:break-all}.nw .t{font-size:12px;color:var(--mute)}
.mq{flex:1;overflow:hidden;white-space:nowrap;min-width:0}
.mq>span{display:inline-block;padding-right:4px}
.mq.go>span{animation:mq var(--t,6s) linear infinite}
/* 받은 편지함 */
.ibrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ibrow:first-child{border-top:0}
.ibno{flex:none;min-width:40px;text-align:center;font-weight:750;font-size:13px;color:var(--accent);background:var(--soft);border-radius:10px;padding:4px 6px;font-variant-numeric:tabular-nums}
.ibq{flex:1;font-size:15px;line-height:1.4}
.ibbtn{flex:none;white-space:nowrap;font-weight:650;font-size:14px;display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:99px;background:var(--accent);color:var(--onacc)!important;text-decoration:none;box-shadow:none}
.ibbtn svg{width:16px;height:16px}
.iball{display:inline-block;margin-top:10px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.ib{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.ib:first-child{border-top:0}
.ib .no{font-size:15px;font-weight:750;min-width:44px}
.ib .t{font-size:15px;font-weight:500}.ib.new .t{font-weight:800}
.ib .s{font-size:13px;opacity:.85;margin-top:2px}.ib .m{font-size:12px;color:var(--mute);margin-top:2px}
.ib .ans{font-size:14px;margin-top:4px;padding:6px 10px;background:var(--soft);border-radius:10px}
.ib.old{opacity:.6}
.bdg{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;margin-left:4px;color:#fff;background:var(--warn);border-radius:99px;vertical-align:1px}
.bdg.ok{background:var(--ok)}
.ibbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* 논문 그림·노트 */
.note{padding:12px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note .t{font-size:15px;font-weight:650;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.note .t>svg{width:26px;height:26px;flex:none}
.note .s{font-size:13px;color:var(--mute);margin:2px 0 6px}
.note ul{margin:0;padding-left:20px}
.note li{margin:3px 0;font-size:14px}
.nrow{padding:9px 0;font-size:14.5px;line-height:1.4;border-top:1px solid var(--line)}
.nrow:first-of-type{border-top:0}
.nrow .mute{font-size:11.5px}
.nlink{display:inline;color:var(--ink);text-decoration:none;font-weight:550}
.nlink span{color:var(--accent);font-weight:650;white-space:nowrap}
.npgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.npg{font:inherit;font-size:14px;font-weight:650;min-width:36px;height:36px;padding:0 10px;border-radius:12px;border:0;background:var(--soft);color:var(--ink);cursor:pointer}
.npg.on{background:var(--accent);color:var(--onacc);box-shadow:none}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fbtn,.fullbtn{font:inherit;font-size:13px;font-weight:400;display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border:0;background:var(--accent);color:var(--onacc);border-radius:99px;cursor:pointer;max-width:100%;text-align:left;text-decoration:none}
.fbtn svg,.fullbtn svg{width:16px;height:16px;flex:none}
.fbtn.off,.fullbtn.off{opacity:.5;cursor:default;background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.iblink{display:inline-block;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--soft);margin:2px 4px 2px 0}
/* 체크리스트 */
.todo{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo .ic svg{width:34px;height:34px;display:block}
.todo .w{font-size:12px;font-weight:700;color:var(--accent)}
.todo .d{font-size:15px;font-weight:600}
.todo.done .d{opacity:.8}
.rv{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}.rv.ok{opacity:.5}
.rv .t{font-size:15px;font-weight:700}.rv .m{font-size:12px;color:var(--mute)}
.rvb{font:inherit;font-size:20px;background:none;border:0;cursor:pointer;padding:2px 6px}
.hist{margin-top:12px}
/* 보기 창 */
#viewer{position:fixed;inset:0;background:rgba(30,30,28,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;z-index:50;padding:max(12px,env(safe-area-inset-top)) 10px 12px}
#viewer.on{display:flex;flex-direction:column}
#viewer .bar{display:flex;gap:8px;align-items:center;background:var(--card);padding:10px 12px;border-radius:16px 16px 0 0;height:auto;margin:0;box-shadow:none}
#viewer .bar b{flex:1;font-size:13px;overflow-wrap:anywhere}
#viewer .bar button{font:inherit;font-size:14px;font-weight:400;padding:6px 14px;border:0;border-radius:99px;background:var(--accent);color:var(--onacc);cursor:pointer}
#viewer .body{flex:1;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:0 0 16px 16px;padding:10px}
#viewer pre{margin:0;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;word-break:break-word}
#viewer img{max-width:100%;height:auto;display:block;background:#fff}
#viewer table{border-collapse:collapse;font-size:12px}
#viewer td,#viewer th{border:1px solid var(--line);padding:3px 6px;white-space:nowrap}
/* 바로가기 줄: 데스크톱 왼쪽 세로 / 휴대폰 아래 탭바 */
.rail{position:fixed;z-index:40;background:var(--card);border:1px solid var(--cardline);box-shadow:var(--shadow);display:grid}
.rail a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:650;color:var(--mute);text-decoration:none;border-radius:14px;padding:6px 2px;-webkit-tap-highlight-color:transparent}
.rail a svg{width:30px;height:30px}
.rail a.on{color:var(--accent);background:var(--soft)}
.rail .logo{display:none}
@media (min-width:769px){
 body{padding-left:116px}
 .rail{left:16px;top:16px;bottom:16px;width:80px;border-radius:24px;padding:12px 8px;align-content:start;gap:6px;overflow-y:auto}
 .rail .logo{display:flex;margin-bottom:6px}
 .rail .logo svg{width:40px;height:40px}
 .rail .logo .li{color:var(--brown2)}
 .rail a svg{width:34px;height:34px}
}
@media (max-width:768px){
 body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
 .rail{left:0;right:0;bottom:0;grid-template-columns:repeat(7,1fr);gap:2px;padding:6px 6px max(6px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
 .rail a{padding:5px 0}
 .rail a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
}
section.card{scroll-margin-top:16px}
/* 아이콘 움직임 */
.li{display:inline-block;vertical-align:middle;flex:none;overflow:visible;color:var(--mute)}
.gl,.hi .li,.rail .li,.fbtn .li,.fullbtn .li{color:inherit}
.li.go,:is(.nd.on,.ag.running,.nw,.todo.running,.faces .f.on) .li{color:var(--brown2)}
.todo.failed .li{color:var(--bad)}
.li g,.li path{transform-box:fill-box}
:is(.go,.nd.on,.ag.running,.nw,.todo.running,.mascot,.logo) .li :is(.m-pulse,.m-l,.m-r,.m-blink,.m-scan,.m-bar,.m-flip,.m-write,.m-hand,.m-a,.m-b,.m-h,.m-needle,.m-turn,.m-draw,.m-dash){animation:var(--an) var(--du,2s) var(--ea,ease-in-out) var(--de,0s) infinite}
.li .m-pulse{transform-origin:center;--an:li-pulse;--du:1.8s}
.li .m-dash{--an:li-dash;--du:1s;--ea:linear}
:is(.go,.nd.on,.ag.running,.nw,.mascot,.logo) .li .m-dash{stroke-dasharray:2 2.4}
.li .m-l{--an:li-l;--du:1.6s}.li .m-r{--an:li-r;--du:1.6s}
.li .m-blink{--an:li-blink;--du:1.4s}
.li .m-scan{--an:li-scan;--du:2.4s}
.li .m-draw{--an:li-draw;--du:2.4s}
:is(.go,.nd.on,.ag.running,.nw,.todo.running) .li .m-draw{stroke-dasharray:1 1}
.li .m-draw.d2{--de:.35s}.li .m-draw.d3{--de:.7s}
.li .m-bar{transform-origin:center bottom;--an:li-bar;--du:1.6s}.li .b2{--de:.25s}.li .b3{--de:.5s}
.li .m-flip{transform-origin:left center;--an:li-flip;--du:2.6s}
.li .m-write{--an:li-write;--du:1.2s}
.li .m-hand{transform-origin:center;--an:spin;--du:6s;--ea:linear}
.li .m-a{--an:li-talk;--du:2.4s}.li .m-b{--an:li-talk;--du:2.4s;--de:-1.2s}
.li .m-h{--an:li-bob;--du:1.8s}.li .h1{--de:.3s}.li .h3{--de:.6s}
.li .m-needle{transform-origin:center;--an:li-needle;--du:2.4s}
.li .m-turn{transform-origin:center;--an:li-turn;--du:2.6s}
@keyframes li-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
@keyframes li-dash{to{stroke-dashoffset:-4.4}}
@keyframes li-l{0%,100%{transform:translateX(0)}50%{transform:translateX(-1.2px)}}
@keyframes li-r{0%,100%{transform:translateX(0)}50%{transform:translateX(1.2px)}}
@keyframes li-blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes li-scan{0%,100%{transform:translateX(-1.6px)}50%{transform:translateX(1.6px)}}
@keyframes li-draw{0%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
@keyframes li-bar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes li-flip{0%,55%,100%{transform:scaleX(1)}78%{transform:scaleX(.15)}}
@keyframes li-write{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,.6px)}50%{transform:translate(.4px,1.2px)}75%{transform:translate(-.6px,.4px)}}
@keyframes li-talk{0%,40%{opacity:1}50%,90%{opacity:.3}100%{opacity:1}}
@keyframes li-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}

const GHK={base:"net",team:"people",wand:"net",gear:"cpu",brush:"bars",check:"list",star:"people",chart:"line",coin:"gauge"};   // 예전 이름 → 선 아이콘
const AGI={"orchestrator":"net","code-writer":"code","code-checker":"mag","compute-manager":"cpu","results-analyst":"line","figure-maker":"bars","note-writer":"note","research-advisor":"book","paper-writer":"paper","codex-reviewer":"shield","session-recorder":"clock","debate-moderator":"chat","review-panel":"people","html-publisher":"web","token-watcher":"gauge","user":"user"};
function li(k,o){o=o||{};const s=o.s||24;return `<svg class="li ${o.cls||""}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${LI[k]||LI.doc}</svg>`}
function gh(k,o){o=o||{};return li(GHK[k]||k,{s:o.s||28,cls:o.cls})}
function gl(k,s){return li(GHK[k]||k,{s:s||16,cls:"gl"})}
function pet(id,o){o=o||{};return li(AGI[id]||"doc",{s:o.s||40,cls:o.cls})}
document.querySelectorAll("[data-gh]").forEach(e=>{e.innerHTML=gh(e.dataset.gh,{s:+(e.dataset.s||28),cls:e.dataset.cls||""})});
document.querySelectorAll("[data-gl]").forEach(e=>{e.outerHTML=gl(e.dataset.gl)});
const NAME={"code-writer":"코드 작성","code-checker":"코드 점검","compute-manager":"계산 조절","research-advisor":"문헌 검증","paper-writer":"논문 초안","results-analyst":"결과 분석","html-publisher":"노트 HTML","figure-maker":"그래프","note-writer":"실험노트","codex-reviewer":"Codex 검토","session-recorder":"기록","debate-moderator":"토론","review-panel":"심사 패널","token-watcher":"토큰 감시","general":"일반","general-purpose":"일반","Explore":"탐색","fork":"분기","orchestrator":"오케스트레이터"};
let UP=new Set(),FG="";
const ICON=f=>gl(f.endsWith(".png")?"image":f.endsWith(".md")||f.endsWith(".html")?"note":f.endsWith(".csv")?"chart":f.endsWith(".py")?"code":"doc");
function noteHref(f){return "note.html?v="+VER+"#"+new URLSearchParams({g:FG,f:f.replace(/\//g,"__"),b:GIST})}
function noteLink(f,label){if(!f)return esc(label);return UP.has(f)?`<a class="nlink" href="${noteHref(f)}">${esc(label)} <span style="font-size:12px">↗ 열기</span></a>`:`${esc(label)} <span class="mute" style="font-size:12px">(올리는 중)</span>`}
function filesHTML(fs){if(!fs||!fs.length)return "";return `<div class="files">${fs.map(f=>{const on=UP.has(f);const nm=f.split("/").pop();
  if(on&&f.endsWith(".html"))return `<a class="fbtn" href="${noteHref(f)}">${ICON(f)} ${esc(nm)} ↗</a>`;
  return `<button class="fbtn${on?"":" off"}" data-f="${esc(f)}" title="${esc(f)}">${ICON(f)} ${esc(nm)}${on?"":" (올리는 중)"}</button>`}).join("")}</div>`}
function csvTable(t){const rows=t.trim().split(/\r?\n/).slice(0,300).map(l=>l.split(","));
  return `<div style="overflow:auto"><table>${rows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join("")}</tr>`).join("")}</table></div>`}
async function openFile(f){const v=document.getElementById("viewer"),b=document.getElementById("vbody");
  document.getElementById("vname").textContent=f;b.style.padding="";b.innerHTML='<div class="mute">불러오는 중…</div>';v.classList.add("on");
  const key=(f.replace(/\//g,"__")+(f.endsWith(".png")?".b64":"")).normalize("NFC");
  try{const r=await fetch("https://gist.githubusercontent.com/jjbangcode/"+FG+"/raw/"+encodeURIComponent(key)+"?t="+Date.now());
    if(!r.ok)throw new Error(r.status);const t=await r.text();
    if(f.endsWith(".png")){const i=new Image();i.onload=()=>{if(i.naturalWidth>2400){i.style.maxWidth="none";i.style.width="1100px"}};i.src="data:image/png;base64,"+t.trim();i.alt=f;b.innerHTML='<div class="mute" style="font-size:12px;margin-bottom:6px">큰 그림은 옆으로 밀어서 보세요 ↔</div>';b.appendChild(i)}
    else if(f.endsWith(".html")){const doc=new DOMParser().parseFromString(t,"text/html");
      await Promise.all([...doc.querySelectorAll("img[data-src]")].map(async im=>{try{
        const k=(im.dataset.src.replace(/\//g,"__")+".b64").normalize("NFC");
        const q=await fetch("https://gist.githubusercontent.com/jjbangcode/"+FG+"/raw/"+encodeURIComponent(k)+"?t="+Date.now());
        if(q.ok)im.src="data:image/png;base64,"+(await q.text()).trim();else im.alt="(그림 올리는 중) "+im.alt}catch(_){}}));
      doc.querySelectorAll("script").forEach(x=>x.remove());
      const fr=document.createElement("iframe");fr.setAttribute("sandbox","");fr.style.cssText="border:0;width:100%;height:100%;display:block;background:#fff";
      fr.srcdoc="<!doctype html>"+doc.documentElement.outerHTML;b.innerHTML="";b.style.padding="0";b.appendChild(fr)}
    else if(f.endsWith(".csv"))b.innerHTML=csvTable(t);
    else{const pr=document.createElement("pre");pr.textContent=t;b.innerHTML="";b.appendChild(pr)}
  }catch(e){b.innerHTML='<div class="mute">파일을 못 불러왔어요 ('+esc(String(e.message||e))+'). 1~2분 뒤 다시 눌러 보세요.</div>'}}
document.addEventListener("click",e=>{const nt=e.target.closest(".nopen");if(nt&&nt.dataset.f&&UP.has(nt.dataset.f))openFile(nt.dataset.f);const x=e.target.closest(".fbtn");if(x&&!x.classList.contains("off"))openFile(x.dataset.f);
  if(e.target.id==="vclose"||e.target.id==="viewer")document.getElementById("viewer").classList.remove("on")});
function sprite(id){return pet(id,{s:40})}
function runner(id){return pet(id,{s:40,cls:"go"})}
const TEAM=[["code-writer","코드 작성","새 코드·수정"],["code-checker","코드 점검","누수·계산 오류 찾기"],["compute-manager","계산 조절","컴퓨터 부하·실행"],["results-analyst","결과 분석","짝 비교·신뢰구간"],["figure-maker","그래프","결과 그림"],["note-writer","실험노트","노트 작성"],["research-advisor","문헌 검증","논문 비교·더 좋은 방법"],["paper-writer","논문 초안","원고 쓰기"],["codex-reviewer","Codex 검토","최종 관문·교차 검토"],["session-recorder","기록","인수인계·다른 창 이어 하기"],["debate-moderator","토론","전문가 8명 토론 진행"],["review-panel","심사 패널","npj 편집자·리뷰어 10명이 새 그림마다 더 할 실험 제안"],["html-publisher","노트 HTML","노트를 보기 좋게"],["token-watcher","토큰 감시","에이전트별 토큰 집계·아끼는 방법"]];
function nowHTML(ag,now){
  const run=TEAM.map(([id,nm])=>[id,nm,ag.find(a=>(a.role===id||a.agent===id)&&a.state==="running")]).filter(x=>x[2]);
  return run.map(([id,nm,r])=>`<div class="nw">${sprite(id)}<div><div class="n">${gl("hour",18)} ${nm} <span class="t">· ${dur(now-r.start)}째</span></div><div class="d">${esc(r.desc||"")}</div></div></div>`).join("")||`<div class="empty">지금 일하는 에이전트 없음</div>`}
function facesHTML(ag){const D=window.__d||{},G=D.guard||{state:"off"},now=D.now||Date.now()/1000,o=D.orchestrator||{};
  const tm=s=>{s=Math.max(0,Math.round(s));return s<60?s+"초":s<3600?Math.floor(s/60)+"분":Math.floor(s/3600)+"시간"+Math.round(s%3600/60)+"분"};
  const ob=o.state==="busy";

  const mcls=s.mem_free_pct<15?"bad":s.mem_free_pct<25?"warn":"ok";
  const dcls=s.disk_free_gb<20?"bad":s.disk_free_gb<40?"warn":"ok";
  const tcls=s.cpu_speed_limit<70?"bad":s.cpu_speed_limit<100?"warn":"ok";
  {const g=d.guard||{state:"off"};const GS={ok:["ok","감시 중 · 안전"],warn:["warn","감시 중 · 주의: "+(g.warn||[]).join(", ")],danger:["failed","위험 — 1분 계속되면 학습 일시정지"],paused:["failed","학습 "+g.paused+"개 일시정지함 (컴퓨터 보호)"],off:["unknown","감시 꺼짐 (Mac 확인 필요)"]}[g.state]||["unknown",g.state];
   const ev=(g.events||[]).slice(-1)[0];
   document.getElementById("guard").innerHTML=`<span class="dot ${GS[0]==="ok"?"done":GS[0]}"></span><div><div><span class="tag">계산 조절 · 실시간</span> ${esc(GS[1])}</div><div class="mute">20초마다 확인${g.jobs!=null?" · 학습 프로세스 "+g.jobs+"개":""}${ev?" · 최근: "+esc(ev[1]):""}</div></div>`;}
  document.getElementById("sys").innerHTML=`
   <div class="stat"><div class="mute">CPU 부하 (1분)</div><div class="v ${lcls}">${ld??"–"} <span class="mute">/ ${s.ncpu??"–"}코어</span></div></div>
   <div class="stat"><div class="mute">메모리 여유</div><div class="v ${mcls}">${s.mem_free_pct??"–"}%</div></div>
   <div class="stat"><div class="mute">디스크 여유</div><div class="v ${dcls}">${s.disk_free_gb??"–"} GB</div></div>
   <div class="stat"><div class="mute">발열</div><div class="v ${tcls}">${s.cpu_speed_limit==null?"–":s.cpu_speed_limit>=100?"정상":"뜨거움"}</div><div class="mute" style="font-size:12px">${s.cpu_speed_limit==null?"":s.cpu_speed_limit>=100?"열 때문에 느려지지 않음":"열 때문에 속도 "+s.cpu_speed_limit+"%로 제한"}</div></div>`;
  document.getElementById("notes").innerHTML=notesHTML(d.notes);
}
const GIST=location.hash.slice(1).replace(/[^0-9a-f]/g,"");try{document.getElementById("rvlink").href="review.html#"+GIST}catch(e){}
async function load(){
  try{const r=await fetch("https://api.github.com/gists/"+GIST,{cache:"no-store"});
      if(r.ok){const g=await r.json();return JSON.parse(g.files["status.json"].content)}}catch(e){}
  const r=await fetch("https://gist.githubusercontent.com/jjbangcode/"+GIST+"/raw/status.json?t="+Date.now());
  return r.json();
}
async function tick(){
  if(!GIST){document.getElementById("upd").textContent="주소 끝에 #(데이터 번호)가 필요해요";return}
  try{const d=await load();render(d);
      const late=Date.now()/1000-d.now;
      if(late>300)document.getElementById("upd").textContent="⚠ Mac 에서 "+Math.round(late/60)+"분째 소식 없음 (Mac 꺼짐·잠자기·전송 멈춤)";
      else document.getElementById("upd").textContent="Mac 기준 "+new Date(d.now*1000).toLocaleTimeString("ko-KR")+" ("+Math.round(late)+"초 전)";}
  catch(e){document.getElementById("upd").textContent="불러오기 실패 — 잠시 뒤 다시 시도해요"}
}
const VER="68";   // 화면 버전: 바뀌면 휴대폰에 남아 있는 옛 화면을 스스로 새로 받음
async function verCheck(){try{const t=await (await fetch(location.pathname+"?nc="+Date.now(),{cache:"no-store"})).text();
  const m=t.match(/const VER="(\d+)"/);if(m&&m[1]!==VER)location.replace(location.pathname+"?v="+m[1]+location.hash)}catch(_){}}
tick();verCheck();setInterval(()=>{tick();verCheck()},90000);
document.getElementById("rf").onclick=e=>{e.currentTarget.textContent="불러오는 중…";   // 화면 자체를 새로 받음 (옛 화면이 남지 않게)
  location.replace(location.pathname+"?v="+Date.now()+location.hash)};
</script>
<script>
/* 받은 편지함 그림 미리보기 (간단 편지함에서는 그릴 그림이 없어도 함수는 있어야 render 가 멈추지 않음) */
const __thumbCache={};async function loadThumbs(){for(const im of document.querySelectorAll("img.ibthumb:not([src])")){const f=im.dataset.f;try{if(!__thumbCache[f]){const key=(f.replace(/\//g,"__")+".b64").normalize("NFC");const r=await fetch("https://gist.githubusercontent.com/jjbangcode/"+FG+"/raw/"+encodeURIComponent(key)+"?t="+Date.now());__thumbCache[f]="data:image/png;base64,"+(await r.text()).trim()}im.src=__thumbCache[f];im.onclick=()=>openFile(f)}catch(e){im.alt="그림을 불러오지 못함"}}}
/* 모션: 숫자 카운트업 (render 뒤에 덧붙임 — render 자체는 그대로) */
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;const __prevV={};
function countUp(){document.querySelectorAll("#sys .stat .v").forEach((v,i)=>{const t=v.firstChild;if(!t||t.nodeType!==3)return;
  const m=t.nodeValue.match(/^(\s*)(-?\d+(?:\.\d+)?)(.*)$/s);if(!m)return;const to=parseFloat(m[2]),dec=(m[2].split(".")[1]||"").length,from=__prevV[i]??0;__prevV[i]=to;
  if(RM||from===to)return;const t0=performance.now(),D=900;
  (function step(now){const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);t.nodeValue=m[1]+(from+(to-from)*e).toFixed(dec)+m[3];if(k<1)requestAnimationFrame(step)})(t0)})}
{const __render=render;render=function(d){__render(d);try{countUp()}catch(_){}}}
/* 바로가기 줄: 보고 있는 섹션 표시 */
(function(){const L=[...document.querySelectorAll(".rail a[href^='#s-']")];if(!("IntersectionObserver" in window))return;
 const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)L.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))})},{rootMargin:"-35% 0px -55% 0px"});
 L.forEach(a=>{const s=document.querySelector(a.getAttribute("href"));if(s)io.observe(s)})})();
(function(){const K="fold_v1";let F={};try{F=JSON.parse(localStorage.getItem(K)||"{}")}catch(_){}
 document.querySelectorAll("section.card").forEach(c=>{const h=c.querySelector(":scope>h2");if(!h)return;const k=h.textContent.trim();
  if(F[k])c.classList.add("fold");
  h.addEventListener("click",()=>{c.classList.toggle("fold");F[k]=c.classList.contains("fold");try{localStorage.setItem(K,JSON.stringify(F))}catch(_){}})})})();

document.addEventListener("click",async e=>{const b=e.target.closest(".fullbtn");if(!b||b.classList.contains("off"))return;e.preventDefault();e.stopPropagation();const f=b.dataset.f;const w=window.open("","_blank");try{const key=(f.replace(/\//g,"__")+".b64").normalize("NFC");const r=await fetch("https://gist.githubusercontent.com/jjbangcode/"+FG+"/raw/"+encodeURIComponent(key)+"?t="+Date.now());const t=(await r.text()).trim();const bin=atob(t);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);const url=URL.createObjectURL(new Blob([u],{type:"image/png"}));if(w){w.document.write('<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=10,user-scalable=yes"><body style="margin:0;background:#fff"><button onclick="window.close();setTimeout(function(){history.length>1?history.back():document.body.innerHTML=\'<p style=padding:20px>이 탭을 닫아 주세요</p>\'},300)" style="position:fixed;top:10px;right:10px;z-index:9;font-size:20px;padding:8px 14px;border:0;border-radius:20px;background:rgba(0,0,0,.65);color:#fff">✕ 닫기</button><img src="'+url+'" style="width:100%;height:auto">')}else{location.href=url}}catch(err){if(w)w.document.write("그림을 불러오지 못했어요")}});
</script>
