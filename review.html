<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>논문·포스터 리뷰 현황</title>
<style>
/* 리뷰 보드: 남색 헤더 + 흰 카드, 에이전트 = 번호 배지 */
:root{--bg:#eef1f6;--card:#fff;--ink:#16202e;--mute:#5b6676;--line:#dde3ec;--navy:#1d2b4f;--acc:#3f6ad8;--ok:#1f8a5b;--warn:#b7791f;--bad:#c2413b;--idle:#8a94a6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#181e29;--ink:#e6eaf2;--mute:#9aa4b5;--line:#2a3242;--navy:#0b1220;--acc:#7c9cf2;--ok:#4cc38a;--warn:#e3a94a;--bad:#ec7a73;--idle:#7d8799;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.top{background:var(--navy);color:#fff;padding:max(18px,env(safe-area-inset-top)) 18px 18px}
.top .in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.top h1{margin:0;font-size:21px;letter-spacing:-.01em}
.top .upd{font-size:13px;opacity:.8;flex-basis:100%}
.top a{color:#fff;font-size:13px;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:4px 10px;text-decoration:none}
main{max-width:1080px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card>h2{margin:0 0 12px;font-size:16px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.card>h2::after{content:"접기";margin-left:auto;font-size:12px;font-weight:500;color:var(--mute)}
.card.fold>h2::after{content:"펼치기"}.card.fold>h2{margin:0}.card.fold>:not(h2){display:none!important}
.badge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;font-size:13px;font-weight:800;flex:none}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.agent{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--idle);border-radius:12px;padding:12px;background:var(--card);color:inherit;font:inherit;cursor:pointer}
.agent:hover{border-color:var(--acc)}
.agent[data-s="완료"]{border-left-color:var(--ok)}.agent[data-s="진행"]{border-left-color:var(--acc)}.agent[data-s="검토필요"]{border-left-color:var(--warn)}
.agent .nm{font-weight:700}.agent .role{font-size:12px;color:var(--mute)}
.agent .sum{grid-column:1/-1;font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px;background:#e7ebf2;color:var(--idle);margin-left:6px}
.pill[data-s="완료"]{background:#dcf2e6;color:var(--ok)}.pill[data-s="진행"]{background:#e3eafd;color:var(--acc)}.pill[data-s="검토필요"]{background:#fbefd9;color:var(--warn)}
@media (prefers-color-scheme:dark){.pill{background:#252d3b}.pill[data-s="완료"]{background:#173527}.pill[data-s="진행"]{background:#1f2b4d}.pill[data-s="검토필요"]{background:#3a2c12}}
.verdict{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline}.verdict b{font-size:22px}
.panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:12px}
.rv{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}.rv b{display:block;font-size:13.5px}.rv span{color:var(--mute);font-size:12px}
.tw{overflow-x:auto}
.rt{border-collapse:collapse;width:100%;font-size:14px}
.rt th,.rt td{border-top:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
.rt th{font-size:12px;color:var(--mute);white-space:nowrap;border-top:0;background:var(--bg)}
.rt td.no{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.rt .orig{display:block;color:var(--mute);text-decoration:line-through;margin-bottom:3px}
.mute{color:var(--mute);font-size:13px}.empty{color:var(--mute);font-size:14px}
.sv{font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;color:#fff;background:var(--idle);white-space:nowrap}
.sv.high{background:var(--bad)}.sv.mid{background:var(--warn)}.sv.low{background:var(--ok)}
.msg{padding:8px 0;border-top:1px solid var(--line)}.msg:first-child{border-top:0}
.msg .w{font-weight:700;font-size:14px}.msg .w small{font-weight:400;color:var(--mute);margin-left:6px}
.rnd{font-weight:800;margin:12px 0 2px;font-size:14px;color:var(--acc)}
.cpy{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer;margin-left:8px}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>

  <section class="card" id="s-analysis"><h2><span class="badge">06</span>내용 분석 (원본 포스터 해석표)</h2><div id="analysis"></div></section>
  <section class="card" id="s-log"><h2><span class="badge">08</span>대화 기록</h2><div id="log"></div></section>

const GIST=location.hash.slice(1).replace(/[^0-9a-f]/g,"");
document.getElementById("back").href="./#"+GIST;
const AG=[["target","research-advisor","타겟 설정","투고처·핵심 주장 고정"],["search","results-analyst","유사 논문","IF 10 이상 논문 찾기"],["verify","code-checker","실험 검증","통계·수치 재계산"],["edit","paper-writer","문장 교정","고IF 표현으로 교정"],["debate","debate-moderator","토론","리뷰어 10인 토론"],["analysis","note-writer","내용 분석","해석표 만들기"],["figures","figure-maker","그림 검정","축·글자·일치 점검"],["log","session-recorder","기록","대화·결정 기록"]];
const ST={"완료":"done","진행":"running","검토필요":"failed","대기":""};
const arr=v=>Array.isArray(v)?v:[];
const T=(t)=>{try{return new Date(t).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return esc(t)}};
const empty=t=>`<div class="empty">${esc(t)}</div>`;
function tbl(cols,rows){return `<div class="tw"><table class="rt"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`}
async function decrypt(){const bin=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey("raw",await crypto.subtle.digest("SHA-256",new TextEncoder().encode(GIST)),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:bin.slice(0,12)},key,bin.slice(12));
  const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();return JSON.parse(txt)}
async function load(){try{const r=await fetch("https://api.github.com/gists/"+GIST,{cache:"no-store"});
   if(r.ok){const g=await r.json();const f=g.files&&g.files["review.json"];if(f&&f.content&&!f.truncated)return JSON.parse(f.content)}}catch(e){}
  return decrypt()}
function render(d){
  const P=(arr(d.projects).sort((a,b)=>String(b.updated).localeCompare(String(a.updated)))[0])||{agents:{},log:[]};
  const A=P.agents||{};
  document.getElementById("upd").textContent=(P.title||"")+" · 갱신 "+T(P.updated);
  document.getElementById("agents").innerHTML=AG.map(([k,id,nm,role],i)=>{const a=A[k]||{},s=a.status||"대기";return `<button class="agent" data-s="${esc(s)}" data-k="${k}"><span class="badge">${String(i+1).padStart(2,"0")}</span><span><span class="nm">${nm}</span><span class="pill" data-s="${esc(s)}">${esc(s)}</span><br><span class="role">${role}</span></span><span class="sum">${esc(a.summary||"")}</span></button>`}).join("");
  document.querySelectorAll(".agent").forEach(b=>b.onclick=()=>{const t=document.getElementById("s-"+b.dataset.k);if(t){t.classList.remove("fold");t.scrollIntoView({behavior:"smooth",block:"start"})}});
  document.getElementById("target").innerHTML=`<p style="margin:0">${esc((A.target||{}).summary||"")}</p>`;
  const db=A.debate||{};
  document.getElementById("sum").innerHTML=`<div class="verdict"><b>${esc(db.verdict||"판정 전")}</b><span class="mute">${esc(P.title||"")} · ${esc(P.venue||"")}</span></div><p style="margin:8px 0 0">${esc(P.note||"")}</p>`;
  const pn=arr(db.panel);
  document.getElementById("panel").innerHTML=pn.map(x=>`<div class="rv"><b>${esc(x.name)}</b><span>${esc(x.role)}</span></div>`).join("");
  let last=null;
  document.getElementById("debate").innerHTML=arr(db.rounds).map(m=>{const h=m.round!==last?`<div class="rnd">${esc(m.round)}</div>`:"";last=m.round;return h+`<div class="msg"><div class="w">${esc(m.speaker)}<small>${esc(m.role||"")}</small></div><div>${esc(m.text)}</div></div>`}).join("")||empty("토론 기록 없음");
  const ed=arr((A.edit||{}).rows);
  document.getElementById("edit").innerHTML=ed.length?tbl(["연번","영어 문장 (원문 → 교정)","한글 문장","근거"],ed.map((r,i)=>`<tr><td class="no">${esc(r.no??i+1)}</td><td>${r.orig?`<span class="orig">${esc(r.orig)}</span>`:""}${esc(r.en)}</td><td>${esc(r.ko)}</td><td class="mute">${esc(r.why||"")}</td></tr>`)):empty("교정 결과 없음");
  const sv=s=>s==="높음"?"high":s==="중간"?"mid":"low";
  document.getElementById("figs").innerHTML=tbl(["대상","점검","심각도","발견","수정 제안"],arr((A.figures||{}).items).map(r=>`<tr><td>${esc(r.figure)}</td><td>${esc(r.check)}</td><td><span class="sv ${sv(r.severity)}">${esc(r.severity)}</span></td><td>${esc(r.finding)}</td><td>${esc(r.fix)}</td></tr>`));
  const vc=v=>/불일치|오류/.test(v)?"high":/주의|확인/.test(v)?"mid":"low";
  document.getElementById("verify").innerHTML=tbl(["연번","주장","보고값","재계산","판정"],arr((A.verify||{}).rows).map((r,i)=>`<tr><td class="no">${i+1}</td><td>${esc(r.claim)}</td><td>${esc(r.reported)}</td><td>${esc(r.recalc)}</td><td><span class="sv ${vc(r.verdict||"")}">${esc(r.verdict)}</span></td></tr>`));
  document.getElementById("papers").innerHTML=tbl(["연번","논문","저널","연도","관련성"],arr((A.search||{}).papers).map((r,i)=>`<tr><td class="no">${i+1}</td><td>${r.doi?`<a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</td><td>${esc(r.journal)}</td><td class="no">${esc(r.year)}</td><td class="mute">${esc(r.note)}</td></tr>`));
  const an=arr((A.analysis||{}).rows);
  document.getElementById("analysis").innerHTML=(an.length?`<div class="mute" style="margin-bottom:6px">수정 전 원본 포스터의 문장입니다.<button class="cpy" id="cp">표 복사</button></div>`:"")+tbl(["연번","영어 문장","한글 문장"],an.map(r=>`<tr><td class="no">${esc(r.no)}</td><td>${esc(r.en)}</td><td>${esc(r.ko)}</td></tr>`));
  const cp=document.getElementById("cp");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(["연번\t영어 문장\t한글 문장"].concat(an.map(r=>[r.no,r.en,r.ko].join("\t"))).join("\n"));cp.textContent="복사됨"}catch(e){cp.textContent="복사 실패"}};
  document.getElementById("log").innerHTML=tbl(["시각","보낸 쪽","받는 쪽","내용"],arr(P.log).slice().sort((a,b)=>String(b.t).localeCompare(String(a.t))).map(r=>`<tr><td class="no">${T(r.t)}</td><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td>${esc(r.text)}</td></tr>`));
}
(async()=>{try{render(await load())}catch(e){document.getElementById("upd").textContent="데이터를 열 수 없습니다. 연구 작업 현황 페이지와 같은 # 주소로 열어 주세요."}})();
</script>
<script>
(function(){const K="rv_fold_v1";let F={};try{F=JSON.parse(localStorage.getItem(K)||"{}")}catch(_){}
 document.querySelectorAll("section.card").forEach(c=>{const h=c.querySelector(":scope>h2");if(!h)return;const k=h.textContent.trim();
  if(F[k])c.classList.add("fold");
  h.addEventListener("click",()=>{c.classList.toggle("fold");F[k]=c.classList.contains("fold");try{localStorage.setItem(K,JSON.stringify(F))}catch(_){}})})})();

document.addEventListener("click",async e=>{const b=e.target.closest(".fullbtn");if(!b||b.classList.contains("off"))return;e.preventDefault();e.stopPropagation();const f=b.dataset.f;const w=window.open("","_blank");try{const key=(f.replace(/\//g,"__")+".b64").normalize("NFC");const r=await fetch("https://gist.githubusercontent.com/jjbangcode/"+FG+"/raw/"+encodeURIComponent(key)+"?t="+Date.now());const t=(await r.text()).trim();const bin=atob(t);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);const url=URL.createObjectURL(new Blob([u],{type:"image/png"}));if(w){w.document.write('<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=10,user-scalable=yes"><body style="margin:0;background:#fff"><img src="'+url+'" style="width:100%;height:auto">')}else{location.href=url}}catch(err){if(w)w.document.write("그림을 불러오지 못했어요")}});
</script>
