<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>논문·포스터 리뷰 현황</title>
<style>
:root{--bg:#fff8ef;--card:#ffffff;--ink:#2e2440;--mute:#7a6d8a;--line:#f0e0cf;--hd1:#ffe2c6;--hd2:#ece2ff;--acc:#f07a2a;--ok:#3f9a5c;--warn:#c98a12;--bad:#d9534f;--idle:#9d93ab;--soft:#fff1e3;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.top{background:linear-gradient(120deg,var(--hd1),var(--hd2));padding:max(18px,env(safe-area-inset-top)) 18px 20px;border-bottom:3px dashed #f5a66a}
.top .in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.top .ttl{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em}
.top .upd{font-size:13px;color:var(--mute);flex-basis:100%}
.top a{color:var(--ink);font-size:13px;border:1.5px solid var(--acc);background:var(--card);border-radius:99px;padding:4px 12px;text-decoration:none}
body{background-image:radial-gradient(circle at 12% 8%,rgba(240,122,42,.07),transparent 30%),radial-gradient(circle at 90% 30%,rgba(155,123,216,.08),transparent 35%)}
.top .ttl #pk{display:flex;gap:2px;align-items:flex-end}
main{max-width:1080px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 20px;box-shadow:0 3px 0 var(--line)}
.card>h2{margin:0 0 12px;font-size:16px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.card>h2::after{content:"접기";margin-left:auto;font-size:12px;font-weight:500;color:var(--mute)}
.card.fold>h2::after{content:"펼치기"}.card.fold>h2{margin:0}.card.fold>:not(h2){display:none!important}
.badge{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:99px;background:var(--soft);color:var(--acc);border:1.5px solid #ff8a3d;font-size:12.5px;font-weight:800;flex:none}
.orchbox{display:flex;gap:16px;align-items:center;background:linear-gradient(90deg,#fff1e3,#f3ecff);border-radius:18px;padding:12px 16px}
.orchbox .onm{font-weight:800;font-size:17px}.orchbox p{margin:6px 0 0;font-size:14px}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.agent{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:18px;padding:12px;background:var(--card);color:inherit;font:inherit;cursor:pointer;transition:transform .12s}
.agent:hover{transform:translateY(-2px);border-color:#ff8a3d}
.agent[data-s="완료"]{background:linear-gradient(var(--card),var(--card)) padding-box}
.agent .no2{font-size:11.5px;font-weight:800;color:var(--acc);margin-right:6px}
.agent .nm{font-weight:800}.role{font-size:12px;color:var(--mute)}
.agent .sum{grid-column:1/-1;font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cat{flex:none;display:block}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 9px;background:#f0ebf5;color:var(--idle);margin-left:6px}
.pill[data-s="완료"]{background:#e2f4e6;color:var(--ok)}.pill[data-s="진행"]{background:#ffe6d2;color:var(--acc)}.pill[data-s="검토필요"]{background:#fdf0d2;color:var(--warn)}
.verdict{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline}.verdict b{font-size:22px;color:var(--acc)}
.panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:12px}
.rv{border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;font-size:13px}.rv b{display:block;font-size:13.5px}.rv span{color:var(--mute);font-size:12px}
.tw{overflow-x:auto}
.rt{border-collapse:collapse;width:100%;font-size:14px}
.rt th,.rt td{border-top:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.rt th{font-size:12px;color:var(--mute);white-space:nowrap;border-top:0;background:var(--soft)}
.rt td.no{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.rt .orig{display:block;color:var(--mute);text-decoration:line-through;margin-bottom:3px}
.mute{color:var(--mute);font-size:13px}.empty{color:var(--mute);font-size:14px}
.sv{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;color:#fff;background:var(--idle);white-space:nowrap}
.sv.high{background:var(--bad)}.sv.mid{background:var(--warn)}.sv.low{background:var(--ok)}
.msg{padding:8px 0;border-top:1px solid var(--line)}.msg:first-child{border-top:0}
.msg .w{font-weight:700;font-size:14px}.msg .w small{font-weight:400;color:var(--mute);margin-left:6px}
.rnd{font-weight:800;margin:12px 0 2px;font-size:14px;color:var(--acc)}
.cpy{font:inherit;font-size:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:2px 10px;cursor:pointer;margin-left:8px}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="top"><div class="in"><div class="ttl"><span id="hdcat"></span><h1>논문·포스터 리뷰 현황</h1><span id="pk"></span></div><a id="back" href="./">← 연구 작업 현황</a><span class="upd" id="upd">불러오는 중…</span></div></div>
<main>
  <section class="card"><h2>판정 · 지금 상태</h2><div id="sum"></div></section>
  <section class="card"><h2>오케스트레이터</h2><div id="orch"></div></section>
  <section class="card"><h2>리뷰 에이전트 8</h2><div id="agents" class="agents"></div></section>
  <section class="card" id="s-debate"><h2><span class="badge">05</span>리뷰어 10인 · 토론</h2><div id="panel" class="panel"></div><div id="debate"></div></section>
  <section class="card" id="s-edit"><h2><span class="badge">04</span>문장 교정 (해석표)</h2><div id="edit"></div></section>
  <section class="card" id="s-figures"><h2><span class="badge">07</span>그림·그래프 검정</h2><div id="figs"></div></section>
  <section class="card" id="s-verify"><h2><span class="badge">03</span>실험 검증</h2><div id="verify"></div></section>
  <section class="card" id="s-search"><h2><span class="badge">02</span>유사 논문 (IF 10 이상)</h2><div id="papers"></div></section>
  <section class="card" id="s-analysis"><h2><span class="badge">06</span>내용 분석 (원본 포스터 해석표)</h2><div id="analysis"></div></section>
  <section class="card" id="s-log"><h2><span class="badge">08</span>대화 기록</h2><div id="log"></div></section>
  <section class="card" id="s-target"><h2><span class="badge">01</span>타겟 설정</h2><div id="target"></div></section>
</main>

async function decrypt(){const bin=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey("raw",await crypto.subtle.digest("SHA-256",new TextEncoder().encode(GIST)),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:bin.slice(0,12)},key,bin.slice(12));
  const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();return JSON.parse(txt)}
async function load(){let g=null,e=null;

   if(r.ok){const j=await r.json();const f=j.files&&j.files["review.json"];if(f&&f.content&&!f.truncated)g=JSON.parse(f.content)}}catch(_){}

  document.getElementById("verify").innerHTML=tbl(["연번","주장","보고값","재계산","판정"],arr((A.verify||{}).rows).map((r,i)=>`<tr><td class="no">${i+1}</td><td>${esc(r.claim)}</td><td>${esc(r.reported)}</td><td>${esc(r.recalc)}</td><td><span class="sv ${vc(r.verdict||"")}">${esc(r.verdict)}</span></td></tr>`));
  document.getElementById("papers").innerHTML=tbl(["연번","논문","저널","연도","관련성"],arr((A.search||{}).papers).map((r,i)=>`<tr><td class="no">${i+1}</td><td>${r.doi?`<a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</td><td>${esc(r.journal)}</td><td class="no">${esc(r.year)}</td><td class="mute">${esc(r.note)}</td></tr>`));
  const an=arr((A.analysis||{}).rows);
  document.getElementById("analysis").innerHTML=(an.length?`<div class="mute" style="margin-bottom:6px">수정 전 원본 포스터의 문장입니다.<button class="cpy" id="cp">표 복사</button></div>`:"")+tbl(["연번","영어 문장","한글 문장"],an.map(r=>`<tr><td class="no">${esc(r.no)}</td><td>${esc(r.en)}</td><td>${esc(r.ko)}</td></tr>`));
  const cp=document.getElementById("cp");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(["연번\t영어 문장\t한글 문장"].concat(an.map(r=>[r.no,r.en,r.ko].join("\t"))).join("\n"));cp.textContent="복사됨"}catch(e){cp.textContent="복사 실패"}};
  document.getElementById("log").innerHTML=tbl(["시각","보낸 쪽","받는 쪽","내용"],arr(P.log).slice().sort((a,b)=>String(b.t).localeCompare(String(a.t))).map(r=>`<tr><td class="no">${T(r.t)}</td><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td>${esc(r.text)}</td></tr>`));
}
(async()=>{try{render(await load())}catch(e){document.getElementById("upd").textContent="데이터를 열 수 없습니다. 연구 작업 현황 페이지와 같은 # 주소로 열어 주세요."}})();
</script>
<script>
(function(){const K="rv_fold_v2";let F={};try{F=JSON.parse(localStorage.getItem(K)||"{}")}catch(_){}
 document.querySelectorAll("section.card").forEach(c=>{const h=c.querySelector(":scope>h2");if(!h)return;const k=h.textContent.trim();
  if(F[k])c.classList.add("fold");
  h.addEventListener("click",()=>{c.classList.toggle("fold");F[k]=c.classList.contains("fold");try{localStorage.setItem(K,JSON.stringify(F))}catch(_){}})})})();
</script>
