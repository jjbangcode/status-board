<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>논문·포스터 리뷰 현황</title>
<style>
:root{--bg:#f5f4f8;--card:#fff;--ink:#1f1a2b;--mute:#7b7489;--line:#e9e6ef;--acc:#6d4fd8;--acc2:#ef7a2e;--ok:#2f9d63;--warn:#c78a10;--bad:#d64545;--idle:#a39cb0;--soft:#f3f0fb;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 20px 10px}
.top .in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.top .ttl{display:flex;align-items:center;gap:8px;margin-right:auto}
.top .ttl svg{display:block}
.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
#pk{display:none}
.top .upd{font-size:12.5px;color:var(--mute);flex-basis:100%;order:5}
.top a#back{color:var(--mute);font-size:13px;text-decoration:none;order:4}
.top a#back:hover{color:var(--acc)}
.ptabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:10px;order:3}
.ptab{font:inherit;font-size:13px;font-weight:700;border:0;background:transparent;color:var(--mute);border-radius:8px;padding:5px 12px;cursor:pointer}
.ptab small{font-weight:500;margin-left:5px;opacity:.8}
.ptab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(31,26,43,.12)}
main{max-width:1120px;margin:0 auto;padding:20px 20px 48px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px rgba(31,26,43,.04)}
.card>h2{margin:0 0 14px;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.card>h2::after{content:"⌄";margin-left:auto;font-size:16px;color:var(--idle);transition:transform .15s}
.card.fold>h2::after{transform:rotate(-90deg)}.card.fold>h2{margin:0}.card.fold>:not(h2){display:none!important}
.badge{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 6px;border-radius:6px;background:var(--soft);color:var(--acc);font-size:11.5px;font-weight:800;flex:none}
/* agents strip */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.agent{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border:1px solid transparent;border-radius:14px;padding:10px 6px 8px;background:transparent;color:inherit;font:inherit;cursor:pointer;transition:background .12s,border-color .12s}
.agent:hover{background:var(--soft)}
.agent.orc{background:var(--soft)}
.agent .ico{height:60px;display:flex;align-items:flex-end}
.agent .tm{font-size:12px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.agent .nm{font-weight:700;font-size:12.5px;line-height:1.3}
.agent .pill{margin:3px 0 0}
.agent.busy{border-color:#f6c9a6;background:#fff7f1}
.agent.busy .tm{color:var(--acc2)}
.agent.busy .cat{animation:float 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes blink{50%{opacity:.45}}
.agent.busy .pill{animation:blink 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.agent.busy .cat,.agent.busy .pill{animation:none}}
.cat{flex:none;display:block}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:#f0eef4;color:var(--idle)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill[data-s="완료"]{background:#e6f5ec;color:var(--ok)}.pill[data-s="진행"]{background:#fdeee3;color:var(--acc2)}.pill[data-s="검토필요"]{background:#fbf1d9;color:var(--warn)}
/* verdict */
.verdict{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:6px}.verdict b{font-size:24px;letter-spacing:-.02em;color:var(--acc)}
/* journals */
.jplan{display:inline-block;background:var(--soft);color:var(--acc);border-radius:10px;padding:6px 12px;font-size:13.5px;margin-bottom:12px;font-weight:700}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.jcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;font-size:13px;background:#fff}
.jcard.pick{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.jtop{display:flex;align-items:center;gap:6px}.jrank{font-weight:800;color:var(--ink)}
.jrole{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;background:#f0eef4;color:var(--mute)}
.jrole[data-r="적정·추천"]{background:var(--soft);color:var(--acc)}.jrole[data-r="도전"]{background:#fdeee3;color:var(--acc2)}.jrole[data-r="안전"]{background:#e6f5ec;color:var(--ok)}
.jif{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.jname{font-weight:800;font-size:15px;line-height:1.3;margin-top:4px}.jpub{color:var(--mute);font-size:12px;margin-bottom:4px}
.jfit{color:var(--ink)}.jcon{color:var(--mute)}.jlink{font-size:12px;margin-top:auto;padding-top:6px;color:var(--acc);text-decoration:none}
/* reviewers / tables / log */
.panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:14px}
.rv{background:var(--bg);border-radius:12px;padding:9px 12px;font-size:13px}.rv b{display:block;font-size:13px}.rv span{color:var(--mute);font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.rt{border-collapse:collapse;width:100%;font-size:14px}
.rt th,.rt td{border-top:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.rt th{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap;border-top:0;background:#faf9fc}
.rt tr:hover td{background:#fcfbfe}
.rt td.no{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.rt .orig{display:block;color:var(--mute);text-decoration:line-through;margin-bottom:3px}
.mute{color:var(--mute);font-size:13px}.empty{color:var(--idle);font-size:13.5px}
.sv{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px;color:#fff;background:var(--idle);white-space:nowrap}
.sv.high{background:var(--bad)}.sv.mid{background:var(--warn)}.sv.low{background:var(--ok)}
.msg{padding:9px 0;border-top:1px solid var(--line)}.msg:first-child{border-top:0}
.msg .w{font-weight:700;font-size:13.5px}.msg .w small{font-weight:400;color:var(--mute);margin-left:6px}
.rnd{font-weight:800;margin:14px 0 2px;font-size:13px;color:var(--acc)}
.cpy{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer;margin-left:8px}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.agent{background:linear-gradient(160deg,color-mix(in srgb,var(--a) 16%,#fff),color-mix(in srgb,var(--a) 6%,#fff));border:1px solid color-mix(in srgb,var(--a) 22%,#fff)}
.agent:hover{background:linear-gradient(160deg,color-mix(in srgb,var(--a) 24%,#fff),color-mix(in srgb,var(--a) 10%,#fff))}
.agent.orc{background:linear-gradient(160deg,color-mix(in srgb,var(--a) 85%,#000),var(--a));color:#fff;border-color:transparent}
.agent.orc .tm{color:#e9e3ff}.agent.orc .pill{background:rgba(255,255,255,.2);color:#fff}
.agent.busy{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,#fff);background:linear-gradient(160deg,color-mix(in srgb,var(--a) 22%,#fff),#fff)}
.agent.orc.busy{background:linear-gradient(160deg,color-mix(in srgb,var(--a) 85%,#000),var(--a))}
.agent.busy .tm{color:var(--a)}.agent.orc.busy .tm{color:#fff}

.agwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.agwrap .agents{grid-template-columns:repeat(3,1fr)}
.flow{background:#fbfaff;border:1px solid var(--line);border-radius:14px;padding:6px}
.fsvg{width:100%;height:auto;display:block}
.edge{fill:none;stroke:#cfcadb;stroke-width:1.6}
.edge.done{stroke:color-mix(in srgb,var(--a) 70%,#fff)}
.edge.dash{stroke-dasharray:4 4}
.edge.live{stroke:var(--a);stroke-width:2.2;stroke-dasharray:6 5;animation:flowdash 1s linear infinite}
@keyframes flowdash{to{stroke-dashoffset:-22}}
.node{cursor:pointer}
.node .nb{fill:#fff;stroke:color-mix(in srgb,var(--a) 35%,#fff);stroke-width:1.2;filter:drop-shadow(0 1px 2px rgba(31,26,43,.08))}
.node:hover .nb{stroke:var(--a)}
.node.busy .nb{stroke:var(--a);stroke-width:2}
.node .nl{font-size:11px;font-weight:700;fill:var(--ink)}
.node .ns{font-size:9.5px;fill:var(--mute)}
.node .sd{fill:#b9b3c6}.node .sd[data-s="완료"]{fill:var(--ok)}.node .sd[data-s="진행"]{fill:var(--acc2)}.node .sd[data-s="검토필요"]{fill:var(--warn)}
.node.busy .sd{animation:blink 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.edge.live,.node.busy .sd{animation:none}}
@media (max-width:860px){.agwrap{grid-template-columns:1fr}}

.pgwrap{margin-top:16px}
.pgtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pgtab{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--mute);border-radius:10px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pgtab.on{border-color:var(--acc);color:var(--acc);background:var(--soft)}
.pgd{width:8px;height:8px;border-radius:50%;background:var(--idle)}.pgd[data-s="완료"]{background:var(--ok)}.pgd[data-s="진행"]{background:var(--acc2)}
.pghead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.pghead .cpy{margin-left:auto}
.pgt td{font-size:13.5px;line-height:1.55}.pgt td:nth-child(2){min-width:280px}.pgt td:nth-child(3){min-width:220px}
.pgt td.op{color:#4b4458;background:#fbfaff;min-width:200px;font-size:13px}
.pgt tr.mv td{background:#fff8f1}.pgt tr.mv td.op{background:#fff3e8}
.pgh{margin:16px 0 6px;font-size:13px}
.pgtodo{margin:0;padding-left:20px;font-size:13.5px}.pgtodo li{margin:2px 0}
@media (max-width:640px){.top{padding:10px 14px}main{padding:14px 12px 40px}.card{padding:14px}.agents{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="top"><div class="in"><div class="ttl"><span id="hdcat"></span><h1>논문·포스터 리뷰 현황</h1><span id="pk"></span></div><a id="back" href="./">← 연구 작업 현황</a><div id="ptabs" class="ptabs"></div><span class="upd" id="upd">불러오는 중…</span></div></div>
<main>
  <section class="card"><h2>에이전트</h2><div class="agwrap"><div id="agents" class="agents"></div><div id="flow" class="flow"></div></div></section>
  <section class="card"><h2>판정 · 지금 상태</h2><div id="sum"></div></section>
  <section class="card" id="s-journals"><h2>타겟 저널</h2><div id="journals"></div></section>
  <section class="card" id="s-debate"><h2><span class="badge">05</span>리뷰어 10인 · 토론</h2><div id="panel" class="panel"></div><div id="debate"></div></section>
  <section class="card" id="s-edit"><h2><span class="badge">04</span>문장 교정 (해석표)</h2><div id="edit"></div></section>
  <section class="card" id="s-figures"><h2><span class="badge">07</span>그림·그래프 검정</h2><div id="figs"></div></section>
  <section class="card" id="s-verify"><h2><span class="badge">03</span>실험 검증</h2><div id="verify"></div></section>
  <section class="card" id="s-search"><h2><span class="badge">02</span>유사 논문 (IF 10 이상)</h2><div id="papers"></div></section>
  <section class="card" id="s-analysis"><h2><span class="badge">06</span>내용 분석 (원본 포스터 해석표)</h2><div id="analysis"></div></section>
  <section class="card" id="s-log"><h2><span class="badge">08</span>대화 기록</h2><div id="log"></div></section>
  <section class="card" id="s-target"><h2><span class="badge">01</span>타겟 설정</h2><div id="target"></div></section>
</main>

function pumpkin(size){return `<svg viewBox="0 0 40 36" width="${size}" height="${size*0.9}" aria-hidden="true"><path d="M20 6c1-3 3-5 6-5" stroke="#3f6b2e" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="13" cy="21" rx="10" ry="12" fill="#ff8a3d" stroke="#2b1d3d" stroke-width="1.8"/><ellipse cx="27" cy="21" rx="10" ry="12" fill="#ff8a3d" stroke="#2b1d3d" stroke-width="1.8"/><ellipse cx="20" cy="21" rx="9" ry="13" fill="#ff9a50" stroke="#2b1d3d" stroke-width="1.8"/><path d="M13 17l3 4h-6zM27 17l3 4h-6z" fill="#2b1d3d"/><path d="M12 25q8 6 16 0q-2 4-8 4q-6 0-8-4z" fill="#2b1d3d"/></svg>`}
const ST={"완료":"done","진행":"running","검토필요":"failed","대기":""};
const arr=v=>Array.isArray(v)?v:[];
const T=(t)=>{try{return new Date(t).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return esc(t)}};
const empty=t=>`<div class="empty">${esc(t)}</div>`;
function tbl(cols,rows){if(!rows.length)return empty("아직 없음");return `<div class="tw"><table class="rt"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`}
async function decrypt(){const bin=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey("raw",await crypto.subtle.digest("SHA-256",new TextEncoder().encode(GIST)),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:bin.slice(0,12)},key,bin.slice(12));
  const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();return JSON.parse(txt)}
async function load(){let g=null,e=null;
  try{const r=await fetch("https://api.github.com/gists/"+GIST,{cache:"no-store"});
   if(r.ok){const j=await r.json();const f=j.files&&j.files["review.json"];if(f&&f.content&&!f.truncated)g=JSON.parse(f.content)}}catch(_){}
  try{e=await decrypt()}catch(_){}
  const up=x=>x?arr(x.projects).map(p=>String(p.updated||"")).sort().pop()||"":"";
  if(g&&e)return up(g)>up(e)?g:e;return g||e}

function flowSVG(A){
  const N={orchestrator:[260,34,"오케스트레이터"],target:[70,112,"01 타겟 설정"],search:[190,112,"02 유사 논문"],analysis:[330,112,"06 내용 분석"],log:[455,34,"08 기록"],
    edit:[110,206,"04 문장 교정"],figures:[260,206,"07 그림 검정"],verify:[410,206,"03 실험 검증"],debate:[200,300,"05 토론"],verdict:[360,300,"판정"]};
  const E=[["orchestrator","target"],["target","search"],["search","analysis"],["analysis","edit"],["analysis","figures"],["analysis","verify"],["edit","debate"],["figures","debate"],["verify","debate"],["debate","verdict"],["orchestrator","log",1]];
  const st=k=>k==="verdict"?(A.debate&&A.debate.status==="완료"?"완료":"대기"):((A[k]||{}).status||"대기");
  const W=114,H=40;
  const path=(a,b)=>{const [x1,y1]=N[a],[x2,y2]=N[b];
    if(Math.abs(y1-y2)<4){const xa=x1+(x2>x1?W/2:-W/2),xb=x2+(x2>x1?-W/2:W/2);return `M${xa} ${y1}L${xb} ${y2}`}
    const ya=y1+H/2,yb=y2-H/2,my=(ya+yb)/2;return `M${x1} ${ya}C${x1} ${my} ${x2} ${my} ${x2} ${yb}`};
  let e=E.map(([a,b,d])=>{const sb=st(b),sa=st(a);const live=sb==="진행"||sa==="진행";const done=sa==="완료"&&sb!=="대기";
    return `<path d="${path(a,b)}" class="edge${live?" live":""}${done?" done":""}${d?" dash":""}" style="--a:${ACC[b]||"#7c5cff"}"/>`}).join("");
  let n=Object.entries(N).map(([k,[x,y,l]])=>{const s=st(k);const a=ACC[k]||"#7c5cff";
    return `<g class="node${s==="진행"?" busy":""}" data-k="${k}" transform="translate(${x-W/2} ${y-H/2})" style="--a:${a}">
      <rect width="${W}" height="${H}" rx="12" class="nb"/>
      ${k==="verdict"?`<circle cx="21" cy="20" r="11" fill="${a}"/><path d="M15.5 20.5l3.5 3.5 7-7.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:`<g transform="translate(3 2) scale(.56)">${cat(k,64).replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,"")}</g>`}
      <text x="40" y="18" class="nl">${l}</text><circle cx="44" cy="28" r="3" class="sd" data-s="${s}"/><text x="51" y="31" class="ns">${s==="진행"?"일하는 중":s}</text></g>`}).join("");
  return `<svg viewBox="0 0 520 330" class="fsvg" role="img" aria-label="에이전트 연결 흐름"><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#d9d5e3"/></pattern></defs><rect width="520" height="330" rx="14" fill="url(#dots)"/>${e}${n}</svg>`}


let PARA_SEL=null;
const pvc=v=>/안 함|없음|불일치|과장|삭제/.test(v)?"high":/부분/.test(v)?"mid":"low";
function paraHTML(PG){if(!PG.length)return "";
  if(!PG.find(p=>p.id===PARA_SEL))PARA_SEL=(PG.find(p=>p.status!=="완료"&&p.rows.length)||PG.find(p=>p.rows.length)||PG[0]).id;
  const tabs=`<div class="pgtabs">${PG.map(p=>`<button class="pgtab${p.id===PARA_SEL?" on":""}" data-g="${esc(p.id)}"><span class="pgd" data-s="${esc(p.status)}"></span>${esc(p.title)}</button>`).join("")}</div>`;
  const p=PG.find(x=>x.id===PARA_SEL);
  let body="";
  if(!p.rows.length){body=`<div class="empty pgbox">${esc(p.title)} · ${esc(p.topic||"")} — 에이전트가 검토 중이에요.</div>`}
  else{
    const en=p.rows.filter(r=>!String(r[0]).startsWith("→")).map(r=>r[0]).join(" ");
    body=`<div class="pgbox"><div class="pghead"><b>${esc(p.title)}</b><span class="mute">${esc(p.topic||"")}</span><button class="cpy" data-copy="${esc(en)}">영문 단락 복사</button></div>
    <div class="tw"><table class="rt pgt"><thead><tr><th>연번</th><th>영문 (수정안)</th><th>한글</th><th>의견</th></tr></thead><tbody>${p.rows.map((r,i)=>`<tr${String(r[0]).startsWith("→")?' class="mv"':""}><td class="no">${i+1}</td><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="op">${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>
    ${p.refs.length?`<h4 class="pgh">인용·본문 확인</h4><div class="tw"><table class="rt"><thead><tr><th>항목</th><th>실제 내용</th><th>판정</th></tr></thead><tbody>${p.refs.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td><span class="sv ${pvc(r[2])}">${esc(r[2])}</span></td></tr>`).join("")}</tbody></table></div>`:""}
    ${p.todo.length?`<h4 class="pgh">저자 확인 필요</h4><ol class="pgtodo">${p.todo.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>`:""}
    ${p.note?`<p class="mute">※ ${esc(p.note)}</p>`:""}</div>`}
  return `<div class="pgwrap">${tabs}${body}</div>`}
function wirePara(){document.querySelectorAll(".pgtab").forEach(b=>b.onclick=()=>{PARA_SEL=b.dataset.g;render(DATA)});
  document.querySelectorAll(".pgbox .cpy").forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.copy);b.textContent="복사됨"}catch(_){}})}
let DATA=null;
function render(d,pid){
  DATA=d;
  document.getElementById("hdcat").innerHTML=cat("orchestrator",34);document.getElementById("pk").innerHTML=pumpkin(30)+pumpkin(22);
  const PS=arr(d.projects).slice().sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));
  if(!pid){try{pid=localStorage.getItem("rv_proj")}catch(_){}}
  const P=PS.find(p=>p.id===pid)||PS[0]||{agents:{},log:[]};
  try{localStorage.setItem("rv_proj",P.id||"")}catch(_){}
  document.getElementById("ptabs").innerHTML=PS.map(p=>`<button class="ptab${p.id===P.id?" on":""}" data-p="${esc(p.id)}">${esc(p.short||p.title)}<small>${esc(p.kind||"")}</small></button>`).join("");
  document.querySelectorAll(".ptab").forEach(b=>b.onclick=()=>render(DATA,b.dataset.p));
  const J=arr(P.journals);const sj=document.getElementById("s-journals");sj.style.display=J.length?"":"none";
  document.getElementById("journals").innerHTML=(P.journal_plan?`<div class="jplan">${esc(P.journal_plan)}</div>`:"")+`<div class="jgrid">${J.map(j=>`<div class="jcard${j.pick?" pick":""}"><div class="jtop"><span class="jrank">${esc(j.rank)}</span><span class="jrole" data-r="${esc(j.role)}">${esc(j.role)}</span><span class="jif">IF ${esc(j.if)}</span></div><div class="jname">${esc(j.name)}</div><div class="jpub">${esc(j.publisher)}</div><div class="jfit">✓ ${esc(j.fit)}</div><div class="jcon">△ ${esc(j.caveat)}</div>${j.url?`<a class="jlink" href="${esc(j.url)}" target="_blank" rel="noopener">IF 출처</a>`:""}</div>`).join("")}</div>`;
  const A=P.agents||{};
  document.getElementById("upd").textContent=(P.title||"")+" · 갱신 "+T(P.updated);
  const HM=t=>{try{return new Date(t).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hour12:false})}catch(e){return ""}};
  const ALL=[["orchestrator","","오케스트레이터",""]].concat(AG);
  document.getElementById("agents").innerHTML=ALL.map(([k,id,nm],i)=>{const a=A[k]||{},s=a.status||"대기";return `<button class="agent${s==="진행"?" busy":""}${k==="orchestrator"?" orc":""}" data-s="${esc(s)}" data-k="${k}" style="--a:${ACC[k]||"#7c5cff"}"><span class="ico">${cat(k,k==="orchestrator"?64:54)}</span><span class="tm">${esc(HM(a.updated))}</span><span class="nm">${i?String(i).padStart(2,"0")+" ":""}${nm}</span><span class="pill" data-s="${esc(s)}">${esc(s==="진행"?"일하는 중":s)}</span></button>`}).join("");
  document.getElementById("flow").innerHTML=flowSVG(A);
  document.querySelectorAll(".node[data-k]").forEach(g=>g.onclick=()=>{const k=g.dataset.k==="verdict"?"sum":"s-"+g.dataset.k;const t=document.getElementById(k);if(t){(t.closest(".card")||t).classList.remove("fold");(t.closest(".card")||t).scrollIntoView({behavior:"smooth",block:"start"})}});
  document.querySelectorAll(".agent").forEach(b=>b.onclick=()=>{const t=document.getElementById("s-"+b.dataset.k);if(t){t.classList.remove("fold");t.scrollIntoView({behavior:"smooth",block:"start"})}});
  document.getElementById("target").innerHTML=`<p style="margin:0">${esc((A.target||{}).summary||"")}</p>`;
  const db=A.debate||{};
  document.getElementById("sum").innerHTML=`<div class="verdict"><b>${esc(db.verdict||"판정 전")}</b><span class="mute">${esc(P.title||"")} · ${esc(P.venue||"")}</span></div><p style="margin:8px 0 0">${esc(P.note||"")}</p>`+paraHTML(arr(P.paragraphs));
  wirePara();
  const pn=arr(db.panel);
  document.getElementById("panel").innerHTML=pn.map(x=>`<div class="rv"><b>${esc(x.name)}</b><span>${esc(x.role)}</span></div>`).join("");
  let last=null;
  document.getElementById("debate").innerHTML=arr(db.rounds).map(m=>{const h=m.round!==last?`<div class="rnd">${esc(m.round)}</div>`:"";last=m.round;return h+`<div class="msg"><div class="w">${esc(m.speaker)}<small>${esc(m.role||"")}</small></div><div>${esc(m.text)}</div></div>`}).join("")||empty("토론 기록 없음");
  const ed=arr((A.edit||{}).rows);
  document.getElementById("edit").innerHTML=ed.length?tbl(["연번","영어 문장 (원문 → 교정)","한글 문장","근거"],ed.map((r,i)=>`<tr><td class="no">${esc(r.no??i+1)}</td><td>${r.orig?`<span class="orig">${esc(r.orig)}</span>`:""}${esc(r.en)}</td><td>${esc(r.ko)}</td><td class="mute">${esc(r.why||"")}</td></tr>`)):empty("교정 결과 없음");
  const sv=s=>s==="높음"?"high":s==="중간"?"mid":"low";
  document.getElementById("figs").innerHTML=tbl(["대상","점검","심각도","발견","수정 제안"],arr((A.figures||{}).items).map(r=>`<tr><td>${esc(r.figure)}</td><td>${esc(r.check)}</td><td><span class="sv ${sv(r.severity)}">${esc(r.severity)}</span></td><td>${esc(r.finding)}</td><td>${esc(r.fix)}</td></tr>`));
  const vc=v=>/불일치|오류/.test(v)?"high":/주의|확인/.test(v)?"mid":"low";
  document.getElementById("verify").innerHTML=tbl(["연번","주장","보고값","재계산","판정"],arr((A.verify||{}).rows).map((r,i)=>`<tr><td class="no">${i+1}</td><td>${esc(r.claim)}</td><td>${esc(r.reported)}</td><td>${esc(r.recalc)}</td><td><span class="sv ${vc(r.verdict||"")}">${esc(r.verdict)}</span></td></tr>`));
  document.getElementById("papers").innerHTML=tbl(["연번","논문","저널","연도","관련성"],arr((A.search||{}).papers).map((r,i)=>`<tr><td class="no">${i+1}</td><td>${r.doi?`<a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</td><td>${esc(r.journal)}</td><td class="no">${esc(r.year)}</td><td class="mute">${esc(r.note)}</td></tr>`));
  const an=arr((A.analysis||{}).rows);
  document.getElementById("analysis").innerHTML=(an.length?`<div class="mute" style="margin-bottom:6px">수정 전 원본 포스터의 문장입니다.<button class="cpy" id="cp">표 복사</button></div>`:"")+tbl(["연번","영어 문장","한글 문장"],an.map(r=>`<tr><td class="no">${esc(r.no)}</td><td>${esc(r.en)}</td><td>${esc(r.ko)}</td></tr>`));
  const cp=document.getElementById("cp");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(["연번\t영어 문장\t한글 문장"].concat(an.map(r=>[r.no,r.en,r.ko].join("\t"))).join("\n"));cp.textContent="복사됨"}catch(e){cp.textContent="복사 실패"}};
  document.getElementById("log").innerHTML=tbl(["시각","보낸 쪽","받는 쪽","내용"],arr(P.log).slice().sort((a,b)=>String(b.t).localeCompare(String(a.t))).map(r=>`<tr><td class="no">${T(r.t)}</td><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td>${esc(r.text)}</td></tr>`));
}
(async()=>{try{render(await load())}catch(e){document.getElementById("upd").textContent="데이터를 열 수 없습니다. 연구 작업 현황 페이지와 같은 # 주소로 열어 주세요."}})();
</script>
<script>
(function(){const K="rv_fold_v2";let F={};try{F=JSON.parse(localStorage.getItem(K)||"{}")}catch(_){}
 document.querySelectorAll("section.card").forEach(c=>{const h=c.querySelector(":scope>h2");if(!h)return;const k=h.textContent.trim();
  if(F[k])c.classList.add("fold");
  h.addEventListener("click",()=>{c.classList.toggle("fold");F[k]=c.classList.contains("fold");try{localStorage.setItem(K,JSON.stringify(F))}catch(_){}})})})();
</script>
